/* =============================================================================
   MASTERPLAN — fonte única de geometria (sobrevoo 3D + mapa 2D)
   ============================================================================= */
const NORTH_OFFSET = brand.site.northOffsetDeg;

function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shoelace(p) {
  let a = 0;
  for (let i = 0; i < p.length; i++) {
    const [x1, y1] = p[i];
    const [x2, y2] = p[(i + 1) % p.length];
    a += x1 * y2 - x2 * y1;
  }
  return Math.abs(a) / 2;
}

/** Raio do lago em função do ângulo — contorno orgânico. */
function lakeRadius(theta) {
  return 88 + 20 * Math.sin(3 * theta + 0.7) + 11 * Math.cos(5 * theta - 1.2) + 6 * Math.sin(7 * theta);
}

const lakePolygon = Array.from({ length: 160 }, (_, i) => {
  const t = (i / 160) * Math.PI * 2;
  const r = lakeRadius(t);
  return [Math.cos(t) * r, Math.sin(t) * r];
});

/** Faixa (anel) de cada quadra: raio interno adicionado ao contorno do lago. */
const RINGS = [
  { offset: 30, depth: 34, lotWidth: 18, block: "A" },
  { offset: 76, depth: 32, lotWidth: 19, block: "B" },
  { offset: 120, depth: 30, lotWidth: 20, block: "C" },
];

/** Setores angulares reservados a amenidades / bosque (em graus). */
const RESERVED = [
  { from: 8, to: 34, ring: 0, key: "deck" },
  { from: 96, to: 122, ring: 0, key: "mirante" },
  { from: 196, to: 226, ring: 0, key: "trilha" },
  { from: 286, to: 312, ring: 0, key: "pet" },
  { from: 148, to: 182, ring: 1, key: "clube" },
  { from: 330, to: 356, ring: 1, key: "quadras" },
];

const isReserved = (ring, deg) => RESERVED.some((r) => r.ring === ring && deg >= r.from && deg <= r.to);

function bearingOf(dx, dy) {
  const deg = (Math.atan2(dx, dy) * 180) / Math.PI;
  return (deg + NORTH_OFFSET + 360) % 360;
}
const octantOf = (bearing) => Math.round(bearing / 45) % 8;

function buildLots() {
  const rnd = mulberry32(20260826);
  const out = [];

  RINGS.forEach((ring, ri) => {
    const rMid = 100 + ring.offset + ring.depth / 2;
    const count = Math.round((2 * Math.PI * rMid) / ring.lotWidth);
    let number = 1;

    for (let i = 0; i < count; i++) {
      const t0 = (i / count) * Math.PI * 2;
      const t1 = ((i + 1) / count) * Math.PI * 2;
      const midDeg = (((t0 + t1) / 2) * 180) / Math.PI;
      if (isReserved(ri, midDeg)) continue;

      const gap = ((t1 - t0) * 0.06) / 2; // recuo entre lotes
      const a0 = t0 + gap;
      const a1 = t1 - gap;

      const inner = (t) => lakeRadius(t) + ring.offset;
      const outer = (t) => lakeRadius(t) + ring.offset + ring.depth;

      const polygon = [];
      const STEPS = 4;
      for (let s = 0; s <= STEPS; s++) {
        const t = a0 + ((a1 - a0) * s) / STEPS;
        const r = inner(t);
        polygon.push([Math.cos(t) * r, Math.sin(t) * r]);
      }
      for (let s = STEPS; s >= 0; s--) {
        const t = a0 + ((a1 - a0) * s) / STEPS;
        const r = outer(t);
        polygon.push([Math.cos(t) * r, Math.sin(t) * r]);
      }

      const tm = (a0 + a1) / 2;
      const rm = (inner(tm) + outer(tm)) / 2;
      const center = [Math.cos(tm) * rm, Math.sin(tm) * rm];
      const bearing = bearingOf(center[0], center[1]);
      const roll = rnd();

      out.push({
        id: `${ring.block}${String(number).padStart(2, "0")}`,
        block: ring.block,
        number,
        ring: ri,
        polygon,
        center,
        area: Math.round(shoelace(polygon)),
        front: Math.round((a1 - a0) * inner(tm) * 10) / 10,
        bearing,
        octant: octantOf(bearing),
        lakeView: ri === 0,
        status: roll < 0.5 ? "available" : roll < 0.72 ? "reserved" : "sold",
      });
      number++;
    }
  });

  return out;
}

/* =============================================================================
   TERRENO
   ============================================================================= */
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const smoothstep = (a, b, x) => {
  const t = clamp01((x - a) / (b - a || 1e-6));
  return t * t * (3 - 2 * t);
};
const mix = (a, b, t) => a + (b - a) * t;

function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}

function valueNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return mix(mix(a, b, u), mix(c, d, u), v) * 2 - 1;
}

function fbm(x, y, octaves = 4) {
  let amp = 1, freq = 1, sum = 0, norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += valueNoise(x * freq, y * freq) * amp;
    norm += amp;
    amp *= 0.5;
    freq *= 2.03;
  }
  return sum / norm;
}

/** Altura do terreno em coordenadas de plano (metros). */
function heightAt(px, py) {
  const r = Math.hypot(px, py);
  const lr = lakeRadius(Math.atan2(py, px));

  const base = fbm(px * 0.0032, py * 0.0032) * 30 + fbm(px * 0.012, py * 0.012) * 6;
  // colina do mirante, a noroeste
  const ridge = 34 * Math.exp(-((px + 200) ** 2 + (py - 170) ** 2) / (2 * 130 ** 2));
  let h = base + ridge + 4;

  // platô urbanizado: suaviza o relevo onde ficam as quadras
  const dev = smoothstep(lr + 200, lr + 10, r);
  h = mix(h, h * 0.22 + 5.5, dev);

  // escavação do lago
  const shore = smoothstep(lr - 10, lr + 20, r);
  return mix(-8, h, shore);
}

/* =============================================================================
   SOLAR
   ============================================================================= */
function sunPosition(latitude, month, hour) {
  const dayOfYear = Math.round((month + 0.5) * 30.44);
  const decl = 23.44 * Math.sin(((2 * Math.PI) / 365) * (dayOfYear - 81));
  const rad = Math.PI / 180;
  const H = (hour - 12) * 15 * rad;
  const lat = latitude * rad;
  const d = decl * rad;

  const sinAlt = Math.sin(lat) * Math.sin(d) + Math.cos(lat) * Math.cos(d) * Math.cos(H);
  const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));

  const cosAz = (Math.sin(d) - Math.sin(alt) * Math.sin(lat)) / (Math.cos(alt) * Math.cos(lat) || 1e-6);
  let az = Math.acos(Math.max(-1, Math.min(1, cosAz))) / rad;
  if (H > 0) az = 360 - az;

  return { azimuth: az, altitude: alt / rad };
}

function sunPath(latitude, month, step = 0.25) {
  const pts = [];
  for (let h = 0; h <= 24; h += step) pts.push({ hour: h, ...sunPosition(latitude, month, h) });
  return pts;
}

  entered: false,    // usuário iniciou a experiência
  progress: 0,       // 0..1 — progresso de scroll da página
  section: "view",
  focusLot: null,
  hoverLot: null,
  month: 2,          // 0..11
  hour: 16,          // 0..24 (decimal)
  sunAz: 0,
  sunAlt: 0,
  bearing: 0,
};

const listeners = new Set();
function setState(patch) {
  const changed = new Set();
  for (const k of Object.keys(patch)) {
    if (state[k] !== patch[k]) {
      state[k] = patch[k];
      changed.add(k);
    }
  }
  if (changed.size) listeners.forEach((l) => l(changed));
}
const subscribe = (fn) => listeners.add(fn);
const t = () => dict[state.lang];
const $ = (id) => document.getElementById(id);

/* =============================================================================
   PRELOADER
   ============================================================================= */
let preloadPct = 0;
function renderPreloader() {
  const el = $("preloader");
  if (!el) return;
  el.innerHTML = `
    <div class="flex flex-col items-center gap-10 px-6 text-center">
      <div>
        <p class="kicker mb-4">${brand.studio}</p>
        <h1 class="display text-4xl sm:text-6xl">${brand.full}</h1>
      </div>
      <div class="w-[min(420px,80vw)]">
        <div class="mono mb-3 flex justify-between text-[10px] uppercase tracking-[0.24em] text-muted">
          <span>${state.ready ? t().loading : t().loadingSeq}</span>
          <span id="pre-pct">${String(preloadPct).padStart(2, "0")}%</span>
        </div>
        <div class="h-px w-full bg-[rgba(238,241,247,0.14)]">
          <div id="pre-bar" class="h-px bg-accent transition-[width] duration-200 ease-out" style="width:${preloadPct}%"></div>
        </div>
      </div>
      <button data-action="enter" ${state.ready ? "" : "disabled"}
        class="mono group relative overflow-hidden rounded-full border border-[rgba(238,241,247,0.2)] px-9 py-3 text-[11px] uppercase tracking-[0.24em] transition-all duration-500 disabled:opacity-25 hover:border-accent hover:text-accent">
        ${t().enter}
      </button>
    </div>`;
}
function setPreloadPct(p) {
  preloadPct = p;
  const pct = $("pre-pct"), bar = $("pre-bar");
  if (pct) pct.textContent = `${String(p).padStart(2, "0")}%`;
  if (bar) bar.style.width = `${p}%`;
}
{
  const t0 = performance.now();
  const loop = () => {
    if (state.ready) return setPreloadPct(100);
    const e = (performance.now() - t0) / 1000;
    // curva assintótica: sobe rápido e desacelera até 92%
    setPreloadPct(Math.min(92, Math.round(92 * (1 - Math.exp(-e / 1.6)))));
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
subscribe((c) => {
  if (c.has("ready") || c.has("lang")) renderPreloader();
  if (c.has("entered") && state.entered) {
    const el = $("preloader");
    el.classList.replace("opacity-100", "opacity-0");
    el.classList.add("pointer-events-none");
    el.style.transition = "opacity 1s";
    el.style.opacity = "0";
    setTimeout(() => el.remove(), 1100);
  }
});

function navHTML() {
  return HUD_SECTIONS.map((s) => {
    const active = state.section === s.id;
    return `
      <a href="#${s.id}" class="group flex items-center gap-3">

function compassHTML() {
  const labels = OCTANT_LABELS[state.lang];
  const texts = labels.map((l, i) => {
    const a = ((i * 45 - 90) * Math.PI) / 180;
    const x = round(50 + Math.cos(a) * 42);
    const y = round(50 + Math.sin(a) * 42);
    return `<text x="${x}" y="${y + 2.6}" text-anchor="middle" font-size="${i % 2 ? 5.4 : 7}" fill="${i === 0 ? "var(--accent)" : "rgba(238,241,247,0.55)"}" font-family="var(--font-mono)" letter-spacing="0.5">${l}</text>`;
  }).join("");
  const ticks = Array.from({ length: 72 }, (_, i) => {
    const a = ((i * 5 - 90) * Math.PI) / 180;
    const r1 = i % 9 === 0 ? 27 : 30;
    return `<line x1="${round(50 + Math.cos(a) * r1)}" y1="${round(50 + Math.sin(a) * r1)}" x2="${round(50 + Math.cos(a) * 32)}" y2="${round(50 + Math.sin(a) * 32)}" stroke="rgba(238,241,247,0.22)" stroke-width="0.5"/>`;
  }).join("");
  return `
    <div class="relative h-[94px] w-[94px] select-none">
      <svg viewBox="0 0 100 100" class="h-full w-full">
        <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(238,241,247,0.14)"/>
        <circle cx="50" cy="50" r="33" fill="none" stroke="rgba(238,241,247,0.07)"/>
        <g id="compass-rose" style="transform:rotate(${-state.bearing}deg);transform-origin:50px 50px;transition:transform 120ms linear">${texts}${ticks}</g>
        <path d="M50 14 L46.5 22 L53.5 22 Z" fill="var(--accent)"/>
      </svg>
      <span id="compass-deg" class="mono absolute inset-0 flex items-center justify-center text-[11px] tracking-[0.12em] text-ink/80">${String(Math.round(state.bearing)).padStart(3, "0")}°</span>
    </div>`;
}

subscribe((c) => {

    hud.classList.toggle("opacity-0", !state.entered);

  if (c.has("section")) $("hud-nav").innerHTML = navHTML();
  if (c.has("progress")) $("hud-progress").style.width = `${Math.round(state.progress * 100)}%`;
  if (c.has("bearing")) {

const svgPath = (pts, close = true) =>
  pts.map(([x, y], i) => `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ") + (close ? " Z" : "");

const STATUS_FILL = { available: "var(--accent)", reserved: "var(--accent-2)", sold: "#5a6076" };

let lotFilter = "all";
let lotMinArea = summary.minArea;

function renderLots() {
  const lang = state.lang;
  const counts = [
    { key: "all", label: t().filterAll, n: summary.total },
    { key: "available", label: t().available, n: summary.available },
    { key: "reserved", label: t().reserved, n: summary.reserved },
    { key: "sold", label: t().sold, n: summary.sold },
  ];
  const labels = Object.entries(amenitySpots).map(([key, s]) => {
    const a = amenities.find((x) => x.id === key);
    if (!a) return "";
    return `<text x="${s.x}" y="${-s.y - 12}" text-anchor="middle" font-size="9" fill="rgba(238,241,247,0.72)" font-family="var(--font-mono)" letter-spacing="0.6" stroke="rgba(6,7,13,0.9)" stroke-width="2.6" paint-order="stroke">${a.title[lang].toUpperCase()}</text>`;
  }).join("");

  $("lotes").innerHTML = `
    <div class="mx-auto grid max-w-7xl gap-6 px-5 sm:px-7 lg:grid-cols-[1.25fr_0.75fr] lg:pl-40 lg:pr-24">
      <div class="glass rounded-2xl p-4 sm:p-6">

          </div>

          </div>
        </div>

        <svg viewBox="-300 -300 600 600" class="mx-auto aspect-square w-full max-h-[62vh] touch-none">
          <g transform="scale(1,-1)">
            ${[14, 68, 112, 156].map((o) => `<path d="${svgPath(ringPolyline(o, 120))}" fill="none" stroke="rgba(238,241,247,0.13)" stroke-width="${o === 14 ? 5 : 4}"/>`).join("")}
            <path d="${svgPath(lakePolygon)}" fill="rgba(78,201,214,0.16)" stroke="var(--accent-2)" stroke-width="0.8"/>
            ${lots.map((l) => `<path data-lot="${l.id}" d="${svgPath(l.polygon)}" stroke-width="0.7" class="cursor-pointer transition-[fill-opacity] duration-200"><title>${t().lot} ${l.id} — ${l.area} m²</title></path>`).join("")}
            ${Object.values(amenitySpots).map((s) => `<g><circle cx="${s.x}" cy="${s.y}" r="7" fill="none" stroke="var(--accent)" stroke-opacity="0.55" stroke-width="0.8"/><circle cx="${s.x}" cy="${s.y}" r="2" fill="var(--accent)"/></g>`).join("")}
          </g>
          ${labels}
        </svg>

        <div class="mt-4 flex items-center gap-4 border-t hair pt-4">
          <span id="lot-min-label" class="mono text-[10px] uppercase tracking-[0.2em] text-muted"></span>
          <input id="lot-min" type="range" min="${summary.minArea}" max="${summary.maxArea}" value="${lotMinArea}"
            class="h-px flex-1 appearance-none bg-[rgba(238,241,247,0.2)] accent-[var(--accent)]"/>
          <span id="lot-count" class="mono text-[10px] tracking-[0.2em] text-accent"></span>
        </div>
      </div>

      <div id="lot-card" class="glass flex-col rounded-2xl p-6"></div>
    </div>`;

  $("lot-min").addEventListener("input", (e) => {
    lotMinArea = Number(e.target.value);
    updateLotMap();
  });
  updateLotMap();
  renderLotCard();
}

function updateLotMap() {
  const visible = new Set(
    lots.filter((l) => (lotFilter === "all" || l.status === lotFilter) && l.area >= lotMinArea).map((l) => l.id)
  );
  document.querySelectorAll("#lot-filters [data-filter]").forEach((b) => {
    const on = b.dataset.filter === lotFilter;
    b.classList.toggle("border-accent", on);
    b.classList.toggle("text-accent", on);
    b.classList.toggle("border-[rgba(238,241,247,0.16)]", !on);
    b.classList.toggle("text-muted", !on);
    b.classList.toggle("hover:text-ink", !on);
  });
  lots.forEach((l) => {
    const el = document.querySelector(`path[data-lot="${l.id}"]`);
    const on = visible.has(l.id);
    const isSel = state.focusLot === l.id;
    el.setAttribute("fill", isSel ? "#fff" : STATUS_FILL[l.status]);
    el.setAttribute("fill-opacity", isSel ? 0.95 : on ? (l.status === "sold" ? 0.16 : 0.4) : 0.05);
    el.setAttribute("stroke", isSel ? "#fff" : STATUS_FILL[l.status]);
    el.setAttribute("stroke-opacity", on ? 0.75 : 0.12);
  });
  $("lot-min-label").textContent = `${t().area} ≥ ${lotMinArea} m²`;
  $("lot-count").textContent = visible.size;
}

function renderLotCard() {
  const lang = state.lang;
  const selected = lots.find((l) => l.id === state.focusLot) ?? null;
  const card = $("lot-card");
  card.className = `glass flex-col rounded-2xl p-6 ${selected ? "flex" : "hidden lg:flex"}`;

  if (!selected) {
    card.innerHTML = `
      <div class="flex h-full min-h-[320px] flex-col justify-center gap-4 text-center">
        <p class="display text-3xl text-ink/40">${lang === "pt" ? "Selecione um lote" : "Select a lot"}</p>
        <p class="mx-auto max-w-xs text-sm text-ink/45">${lang === "pt" ? "A câmera do sobrevoo acompanha a sua escolha em tempo real." : "The flyover camera follows your choice in real time."}</p>
      </div>`;
    return;
  }

  const rows = [
    [t().area, `${selected.area} m²`],
    [t().front, `${selected.front} m`],
    [t().facing, OCTANT_LABELS[lang][selected.octant]],
    [t().view, selected.lakeView ? (lang === "pt" ? "Lago" : "Lake") : lang === "pt" ? "Bosque" : "Grove"],
  ];
  const back = [3, 4, 5, 6].includes(selected.octant);
  const note = lang === "pt"
    ? `Testada voltada a ${OCTANT_LABELS.pt[selected.octant]} — sol da tarde ${back ? "direto sobre o fundo" : "lateral"}.`
    : `Frontage facing ${OCTANT_LABELS.en[selected.octant]} — afternoon sun ${back ? "straight onto the back yard" : "from the side"}.`;

  card.innerHTML = `
    <div class="fade-up flex h-full flex-col">
      <div class="flex items-start justify-between">
        <div>
          <p class="kicker mb-2">${t().block} ${selected.block}</p>
          <h3 class="display text-5xl">${selected.id}</h3>
        </div>
        <span class="mono rounded-full px-3 py-1 text-[10px] uppercase tracking-[0.18em]"
          style="color:${STATUS_FILL[selected.status]};border:1px solid ${STATUS_FILL[selected.status]}">${t()[selected.status]}</span>
      </div>
      <dl class="mt-8 grid grid-cols-2 gap-y-6">
        ${rows.map(([k, v]) => `<div><dt class="kicker mb-1">${k}</dt><dd class="display text-2xl">${v}</dd></div>`).join("")}
      </dl>
      <div class="mt-8 border-t hair pt-6 text-sm text-ink/60"><p>${note}</p></div>
      <div class="mt-auto flex gap-3 pt-8">
        <a href="#contato" class="mono flex-1 rounded-full border border-accent px-5 py-3 text-center text-[10px] uppercase tracking-[0.22em] text-accent transition-colors hover:bg-accent hover:text-bg">${lang === "pt" ? "Reservar este lote" : "Reserve this lot"}</a>
        <button data-action="close-lot" class="mono rounded-full border border-[rgba(238,241,247,0.18)] px-5 py-3 text-[10px] uppercase tracking-[0.22em] text-muted hover:text-ink">✕</button>
      </div>
    </div>`;
}
subscribe((c) => {
  if (c.has("lang")) renderLots();
  else if (c.has("focusLot")) {
    updateLotMap();
    renderLotCard();
  }
});

function renderNeighborhood() {
  const lang = state.lang;
  const maxMin = Math.max(...neighborhood.map((n) => n.min));
  const rings = [0.34, 0.62, 0.9].map((f) => `
    <g>
      <circle cx="0" cy="0" r="${200 * f}" fill="none" stroke="rgba(238,241,247,0.12)" stroke-dasharray="2 5"/>
      <text x="4" y="${-200 * f + 12}" font-size="9" fill="rgba(238,241,247,0.35)" font-family="var(--font-mono)" letter-spacing="0.6">${Math.round(maxMin * f)} ${t().minutes}</text>
    </g>`).join("");
  const points = neighborhood.map((n) => {
    const ang = Math.atan2(n.y, n.x);
    const r = 40 + (n.min / maxMin) * 158;
    const x = round(Math.cos(ang) * r);
    const y = round(-Math.sin(ang) * r);
    return `
      <g>

/** Projeção estereográfica simples: horizonte na borda, zênite no centro. */
function project(azimuth, altitude, R = 150) {
  const r = R * (1 - Math.max(0, altitude) / 90);
  const a = ((azimuth - 90) * Math.PI) / 180;
  return [round(Math.cos(a) * r), round(Math.sin(a) * r)];
}
const pathOf = (pts) =>
  pts.filter((p) => p.altitude > -1).map((p, i) => {
    const [x, y] = project(p.azimuth, p.altitude);
    return `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");

function updateSolar() {
  const lang = state.lang;
  const { month, hour } = state;
  const now = sunPosition(brand.site.latitude, month, hour);

  $("sol-month").textContent = MONTHS[lang][month];
  $("sol-hour").textContent = `${String(Math.floor(hour)).padStart(2, "0")}:${String(Math.round((hour % 1) * 60)).padStart(2, "0")}`;
  $("sol-az").textContent = `${Math.round(now.azimuth)}°`;
  $("sol-alt").textContent = `${Math.round(now.altitude)}°`;

  $("sol-sun").style.display = above ? "" : "none";
  for (const id of ["sol-halo", "sol-dot"]) {
    $(id).setAttribute("cx", sx);
    $(id).setAttribute("cy", sy);
  }
  $("sol-ray").setAttribute("x2", sx);
  $("sol-ray").setAttribute("y2", sy);
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-lang],[data-filter],[data-lot],[data-action]");
  if (!el) return;
  if (el.dataset.lang) setState({ lang: el.dataset.lang });
  else if (el.dataset.filter) {
    lotFilter = el.dataset.filter;
    updateLotMap();
  } else if (el.dataset.lot) {
    setState({ focusLot: state.focusLot === el.dataset.lot ? null : el.dataset.lot });
  } else if (el.dataset.action === "enter") setState({ entered: true });
  else if (el.dataset.action === "close-lot") setState({ focusLot: null });
});
document.addEventListener("mouseover", (e) => {
  const el = e.target.closest?.("[data-lot]");
  setState({ hoverLot: el ? el.dataset.lot : null });
});

{
  let raf = 0;
  const onScroll = () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const max = document.body.scrollHeight - window.innerHeight;
      setState({ progress: max > 0 ? Math.min(1, window.scrollY / max) : 0 });
    });
  };
  window.addEventListener("scroll", onScroll, { passive: true });

  const io = new IntersectionObserver(
    (entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting) return;
        setState({ section: e.target.id });
        // ao sair da seção de lotes a câmera volta ao roteiro do sobrevoo
        if (e.target.id !== "lotes") setState({ focusLot: null });
      });
    },
    { rootMargin: "-45% 0px -45% 0px" }
  );
  ["view", "lotes", "amenidades", "vizinhanca", "solar", "contato"].forEach((id) => io.observe($(id)));
  requestAnimationFrame(onScroll);
}

/* plano (x,y) -> mundo (x, altura, -y) */
const wx = (px) => px;
const wz = (py) => -py;

const STATUS_COLOR = { available: 0xc8a253, reserved: 0x4ec9d6, sold: 0x5a6076 };

const CAM_PLAN = [
  [600, -470, 360],
  [360, -290, 215],
  [80, -350, 150],
  [-270, -150, 135],
  [-300, 230, 185],
  [80, 380, 205],
  [430, 250, 320],
];
const LOOK_PLAN = [
  [0, 0, 10],
  [0, 0, 6],
  [0, -60, 4],
  [-90, 0, 4],
  [-60, 60, 10],
  [0, 40, 6],
  [0, 0, 8],
];

const toVec = (p) => new THREE.Vector3(wx(p[0]), p[2], wz(p[1]));
const UP = new THREE.Vector3(0, 1, 0);

function buildScene(host) {
  const clock = new THREE.Clock();
  const pointer = { x: 0, y: 0 };

  /* órbita por arraste (clique + arrastar) além do scroll */
  let dragging = false;
  let lastPX = 0, lastPY = 0;
  let orbitYaw = 0, orbitPitch = 0;
  let orbitYawTarget = 0, orbitPitchTarget = 0;
  const PITCH_MIN = -0.55;
  const PITCH_MAX = 0.85;

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
  renderer.setSize(host.clientWidth, host.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.16;
  host.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, host.clientWidth / host.clientHeight, 1, 6000);
  camera.position.copy(toVec(CAM_PLAN[0]));

  const fogColor = new THREE.Color(0x1a2136);
  scene.fog = new THREE.Fog(fogColor, 520, 2400);

  /* ------------------------------- céu ------------------------------- */
  const sunDir = new THREE.Vector3(0.4, 0.5, 0.6).normalize();
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      top: { value: new THREE.Color(0x070912) },
      mid: { value: new THREE.Color(0x27314f) },
      bottom: { value: new THREE.Color(0x5b6280) },
      sun: { value: sunDir },
      sunColor: { value: new THREE.Color(0xffd8a8) },
    },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 top; uniform vec3 mid; uniform vec3 bottom;
      uniform vec3 sun; uniform vec3 sunColor;
      varying vec3 vDir;
      void main() {
        float h = clamp(vDir.y * 0.5 + 0.5, 0.0, 1.0);
        vec3 col = mix(bottom, mid, smoothstep(0.42, 0.62, h));
        col = mix(col, top, smoothstep(0.6, 1.0, h));
        float d = max(dot(normalize(vDir), normalize(sun)), 0.0);
        col += sunColor * pow(d, 220.0) * 2.2;
        col += sunColor * pow(d, 12.0) * 0.20;
        float haze = pow(1.0 - abs(vDir.y), 8.0);
        col = mix(col, vec3(0.42, 0.47, 0.58), haze * 0.5);
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 40, 24), skyMat);
  sky.frustumCulled = false;
  scene.add(sky);

  /* ------------------------------ luzes ------------------------------ */
  const hemi = new THREE.HemisphereLight(0xa9c0ee, 0x1a1f2c, 0.62);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffe3bd, 2.4);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const sc = sun.shadow.camera;
  sc.left = -420; sc.right = 420; sc.top = 420; sc.bottom = -420; sc.near = 1; sc.far = 1800;
  sun.shadow.bias = -0.0008;
  sun.shadow.normalBias = 1.2;
  scene.add(sun, sun.target);

  const pmrem = new THREE.PMREMGenerator(renderer);
  let envRT = null;
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(1000, 24, 16), skyMat));
  const refreshEnv = () => {
    envRT?.dispose();
    envRT = pmrem.fromScene(envScene, 0.02);
    scene.environment = envRT.texture;
  };

  /* ----------------------------- terreno ----------------------------- */
  const SIZE = 2600;
  const SEG = 260;
  const terrainGeo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
  terrainGeo.rotateX(-Math.PI / 2);
  {
    const pos = terrainGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const px = pos.getX(i);
      const py = -pos.getZ(i);
      const d = Math.hypot(px, py);
      let h = heightAt(px, py);
      // beira do mapa desce para o horizonte
      h -= Math.max(0, d - 900) * 0.06;
      pos.setY(i, h);
    }
    terrainGeo.computeVertexNormals();
  }
  const terrainMat = new THREE.MeshStandardMaterial({ color: 0x2b3a2c, roughness: 0.96, metalness: 0 });
  // variação de cor por altura/inclinação
  terrainMat.onBeforeCompile = (shader) => {
    shader.vertexShader = shader.vertexShader
      .replace("#include <common>", "#include <common>\nvarying float vH; varying vec3 vN2;")
      .replace("#include <begin_vertex>", "#include <begin_vertex>\nvH = position.y; vN2 = normal;");
    shader.fragmentShader = shader.fragmentShader
      .replace("#include <common>", "#include <common>\nvarying float vH; varying vec3 vN2;")
      .replace(
        "#include <color_fragment>",
        `#include <color_fragment>
         vec3 sand = vec3(0.36, 0.33, 0.26);
         vec3 grass = vec3(0.20, 0.28, 0.18);
         vec3 high  = vec3(0.28, 0.30, 0.23);
         float t = smoothstep(-2.0, 3.5, vH);
         vec3 c = mix(sand, grass, t);
         c = mix(c, high, smoothstep(14.0, 34.0, vH));
         float slope = 1.0 - clamp(vN2.y, 0.0, 1.0);
         c = mix(c, vec3(0.27,0.25,0.22), smoothstep(0.25, 0.7, slope));
         diffuseColor.rgb *= c * 3.7;`
      );
  };
  const terrain = new THREE.Mesh(terrainGeo, terrainMat);
  terrain.receiveShadow = true;
  scene.add(terrain);

  /* ------------------------------- lago ------------------------------ */
  const waterGeo = new THREE.ShapeGeometry(new THREE.Shape(lakePolygon.map(([x, y]) => new THREE.Vector2(x, y))), 24);
  waterGeo.rotateX(-Math.PI / 2);
  const water = new THREE.Mesh(
    waterGeo,
    new THREE.MeshStandardMaterial({ color: 0x0d1f2e, roughness: 0.045, metalness: 0.95, envMapIntensity: 1.4 })
  );
  water.position.y = 0.15;
  scene.add(water);

  // orla clara (faixa de areia/pedra)
  const shoreGeo = new THREE.ShapeGeometry(
    new THREE.Shape(lakePolygon.map(([x, y]) => {
      const r = Math.hypot(x, y);
      return new THREE.Vector2((x / r) * (r + 7), (y / r) * (r + 7));
    })),
    24
  );
  shoreGeo.rotateX(-Math.PI / 2);
  const shore = new THREE.Mesh(shoreGeo, new THREE.MeshStandardMaterial({ color: 0x4a4438, roughness: 1 }));
  shore.position.y = -0.15;
  shore.receiveShadow = true;
  scene.add(shore);

  /* ------------------------------- vias ------------------------------ */
  function ribbon(points, width, lift = 0.5) {
    const g = new THREE.BufferGeometry();
    const verts = [];
    const idx = [];
    const n = points.length;
    for (let i = 0; i < n; i++) {
      const [x, y] = points[i];
      const [nx, ny] = points[(i + 1) % n];
      const [bx, by] = points[(i - 1 + n) % n];
      let tx = nx - bx;
      let ty = ny - by;
      const len = Math.hypot(tx, ty) || 1;
      tx /= len; ty /= len;
      const ox = -ty * (width / 2);
      const oy = tx * (width / 2);
      const ax = x + ox, ay = y + oy, cx = x - ox, cy = y - oy;
      verts.push(wx(ax), heightAt(ax, ay) + lift, wz(ay));
      verts.push(wx(cx), heightAt(cx, cy) + lift, wz(cy));
    }
    for (let i = 0; i < n; i++) {
      const a = i * 2, b = i * 2 + 1;
      const c = ((i + 1) % n) * 2, d = ((i + 1) % n) * 2 + 1;
      idx.push(a, c, b, b, c, d);
    }
    g.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }
  const roads = new THREE.Mesh(
    mergeGeometries(roadRings.map((r) => ribbon(ringPolyline(r.offset, 260), r.width)), false),
    new THREE.MeshStandardMaterial({ color: 0x191c26, roughness: 0.85, metalness: 0.05 })
  );
  roads.receiveShadow = true;
  scene.add(roads);

  /* ------------------------------- lotes ----------------------------- */
  const lotCenters = new Map();

  function lotGeometry(l, lift) {
    const g = new THREE.ShapeGeometry(new THREE.Shape(l.polygon.map(([x, y]) => new THREE.Vector2(x, y))), 2);
    g.rotateX(-Math.PI / 2);
    const pos = g.attributes.position;
    for (let i = 0; i < pos.count; i++) pos.setY(i, heightAt(pos.getX(i), -pos.getZ(i)) + lift);
    g.computeVertexNormals();
    return g;
  }

  ["available", "reserved", "sold"].forEach((status) => {
    const subset = lots.filter((l) => l.status === status);
    scene.add(new THREE.Mesh(
      mergeGeometries(subset.map((l) => lotGeometry(l, 0.9)), false),
      new THREE.MeshBasicMaterial({
        color: STATUS_COLOR[status],
        transparent: true,
        opacity: status === "available" ? 0.26 : status === "reserved" ? 0.18 : 0.09,
        depthWrite: false,
      })
    ));

    const linePts = [];
    subset.forEach((l) => {
      const pts = l.polygon;
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i];
        const b = pts[(i + 1) % pts.length];
        linePts.push(wx(a[0]), heightAt(a[0], a[1]) + 1.1, wz(a[1]));
        linePts.push(wx(b[0]), heightAt(b[0], b[1]) + 1.1, wz(b[1]));
      }
    });
    const lg = new THREE.BufferGeometry();
    lg.setAttribute("position", new THREE.Float32BufferAttribute(linePts, 3));
    scene.add(new THREE.LineSegments(
      lg,
      new THREE.LineBasicMaterial({ color: STATUS_COLOR[status], transparent: true, opacity: status === "sold" ? 0.28 : 0.6 })
    ));
  });

  lots.forEach((l) =>
    lotCenters.set(l.id, new THREE.Vector3(wx(l.center[0]), heightAt(l.center[0], l.center[1]), wz(l.center[1])))
  );

  // realce do lote selecionado
  const highlight = new THREE.Mesh(
    new THREE.BufferGeometry(),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55, depthWrite: false })
  );
  highlight.visible = false;
  scene.add(highlight);
  const beam = new THREE.Mesh(
    new THREE.CylinderGeometry(1.2, 1.2, 90, 12, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xffe6b0, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false })
  );
  beam.visible = false;
  scene.add(beam);

  /* ------------------------------ árvores ---------------------------- */
  const treeGeo = mergeGeometries(
    [
      new THREE.ConeGeometry(3.2, 9, 6).translate(0, 6.5, 0),
      new THREE.CylinderGeometry(0.5, 0.7, 3, 5).translate(0, 1.5, 0),
    ],
    false
  );
  const TREES = 2200;
  const trees = new THREE.InstancedMesh(
    treeGeo,
    new THREE.MeshStandardMaterial({ color: 0x1d3323, roughness: 1, metalness: 0 }),
    TREES
  );
  trees.castShadow = true;
  trees.receiveShadow = true;
  {
    const dummy = new THREE.Object3D();
    let placed = 0;
    let guard = 0;
    while (placed < TREES && guard < TREES * 40) {
      guard++;
      const a = Math.random() * Math.PI * 2;
      const rr = 120 + Math.pow(Math.random(), 0.6) * 900;
      const px = Math.cos(a) * rr;
      const py = Math.sin(a) * rr;
      const h = heightAt(px, py);
      if (h < 1.2) continue;
      const dist = Math.hypot(px, py);
      // evita a faixa das quadras
      if (dist > 118 && dist < 300) {
        const wedge = Object.values(amenitySpots).some((s) => Math.hypot(s.x - px, s.y - py) < 34);
        if (!wedge && Math.random() > 0.06) continue;
      }
      dummy.position.set(wx(px), h, wz(py));
      const s = 0.65 + Math.random() * 0.9;
      dummy.scale.set(s, s * (0.8 + Math.random() * 0.6), s);
      dummy.rotation.y = Math.random() * Math.PI;
      dummy.updateMatrix();
      trees.setMatrixAt(placed++, dummy.matrix);
    }
    trees.count = placed;
    trees.instanceMatrix.needsUpdate = true;
  }
  scene.add(trees);

  /* --------------------------- amenidades ---------------------------- */
  const amenGroup = new THREE.Group();
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x20242f, roughness: 0.7, metalness: 0.1 });
  const glassMat = new THREE.MeshStandardMaterial({
    color: 0x0e1420, roughness: 0.1, metalness: 0.6, emissive: 0xffc98a, emissiveIntensity: 0.35,
  });
  Object.entries(amenitySpots).forEach(([key, s]) => {
    const g = new THREE.Group();
    const w = key === "clube" ? 46 : 24;
    const d = key === "clube" ? 26 : 16;
    const hgt = key === "mirante" ? 14 : 7;
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, hgt, d), wallMat);
    body.position.y = hgt / 2;
    body.castShadow = true;
    body.receiveShadow = true;
    const band = new THREE.Mesh(new THREE.BoxGeometry(w * 1.01, hgt * 0.3, d * 1.01), glassMat);
    band.position.y = hgt * 0.55;
    const roof = new THREE.Mesh(new THREE.BoxGeometry(w * 1.15, 0.7, d * 1.25), wallMat);
    roof.position.y = hgt + 0.35;
    roof.castShadow = true;
    g.add(body, band, roof);
    g.position.set(wx(s.x), heightAt(s.x, s.y), wz(s.y));
    g.rotation.y = -Math.atan2(s.y, s.x) + Math.PI / 2;
    amenGroup.add(g);
  });
  scene.add(amenGroup);

  // deck sobre a água
  {
    const s = amenitySpots.deck;
    const dir = new THREE.Vector2(-s.x, -s.y).normalize();
    const deck = new THREE.Mesh(new THREE.BoxGeometry(46, 0.8, 14), new THREE.MeshStandardMaterial({ color: 0x3a2f24, roughness: 0.9 }));
    const dx = s.x + dir.x * 44;
    const dy = s.y + dir.y * 44;
    deck.position.set(wx(dx), 1.4, wz(dy));
    deck.rotation.y = -Math.atan2(dy, dx) + Math.PI / 2;
    deck.castShadow = true;
    scene.add(deck);
  }

  /* -------------------------- animação / loop ------------------------ */
  const camCurve = new THREE.CatmullRomCurve3(CAM_PLAN.map(toVec), false, "catmullrom", 0.3);
  const lookCurve = new THREE.CatmullRomCurve3(LOOK_PLAN.map(toVec), false, "catmullrom", 0.3);

  const desiredPos = new THREE.Vector3().copy(camera.position);
  const desiredLook = new THREE.Vector3(0, 0, 0);
  const currentLook = new THREE.Vector3(0, 0, 0);
  let smoothProgress = 0;
  let lastSunKey = "";

  function applySun(month, hour) {
    const { azimuth, altitude } = sunPosition(brand.site.latitude, month, hour);
    setState({ sunAz: azimuth, sunAlt: altitude });
    const planBearing = ((azimuth - brand.site.northOffsetDeg) * Math.PI) / 180;
    const altR = (Math.max(altitude, -6) * Math.PI) / 180;
    const dx = Math.sin(planBearing) * Math.cos(altR);
    const dy = Math.cos(planBearing) * Math.cos(altR);
    const dyy = Math.sin(altR);
    const D = 900;
    sun.position.set(wx(dx * D), dyy * D, wz(dy * D));
    sun.target.position.set(0, 0, 0);
    sun.target.updateMatrixWorld();
    sunDir.set(wx(dx), dyy, wz(dy)).normalize();
    skyMat.uniforms.sun.value.copy(sunDir);

    const day = THREE.MathUtils.clamp((altitude + 4) / 22, 0, 1);
    sun.intensity = 0.25 + day * 2.6;
    const warm = 1 - day;
    sun.color.setHSL(0.09 - warm * 0.03, 0.35 + warm * 0.45, 0.62);
    hemi.intensity = 0.18 + day * 0.5;
    const top = new THREE.Color().setHSL(0.62, 0.5, 0.02 + day * 0.06);
    const mid = new THREE.Color().setHSL(0.6, 0.42, 0.06 + day * 0.22);
    const bot = new THREE.Color().setHSL(0.09 + day * 0.45, 0.4 + warm * 0.3, 0.12 + day * 0.42);
    skyMat.uniforms.top.value.copy(top);
    skyMat.uniforms.mid.value.copy(mid);
    skyMat.uniforms.bottom.value.copy(bot);
    fogColor.copy(mid).lerp(bot, 0.6);
    renderer.setClearColor(fogColor);
    refreshEnv();
  }

  function frame() {
    requestAnimationFrame(frame);
    const st = state;
    const time = clock.getElapsedTime();

    const sunKey = `${st.month}|${st.hour.toFixed(2)}`;
    if (sunKey !== lastSunKey) {
      lastSunKey = sunKey;
      applySun(st.month, st.hour);
    }

    smoothProgress += (st.progress - smoothProgress) * 0.055;
    const p = THREE.MathUtils.clamp(smoothProgress, 0, 1);

    const focus = st.focusLot ? lotCenters.get(st.focusLot) : null;
    if (focus) {
      const away = focus.clone().setY(0).normalize();
      desiredPos.copy(focus).addScaledVector(away, 78).setY(focus.y + 52);
      desiredLook.copy(focus);
    } else {
      camCurve.getPoint(p, desiredPos);
      lookCurve.getPoint(p, desiredLook);
    }

    // parallax suave com o mouse
    desiredPos.x += pointer.x * 14;
    desiredPos.y += pointer.y * 8;

    // órbita manual (clique + arrastar) em torno do ponto observado
    orbitYaw += (orbitYawTarget - orbitYaw) * 0.12;
    orbitPitch += (orbitPitchTarget - orbitPitch) * 0.12;
    if (orbitYaw !== 0 || orbitPitch !== 0) {
      const offset = desiredPos.clone().sub(desiredLook);
      offset.applyAxisAngle(UP, orbitYaw);
      const right = new THREE.Vector3().crossVectors(UP, offset).normalize();
      if (right.lengthSq() > 1e-6) offset.applyAxisAngle(right, orbitPitch);
      desiredPos.copy(desiredLook).add(offset);
    }

    camera.position.lerp(desiredPos, focus ? 0.045 : 0.06);
    currentLook.lerp(desiredLook, 0.07);
    camera.lookAt(currentLook);

    const dx = currentLook.x - camera.position.x;
    const dy = -(currentLook.z - camera.position.z);
    const b = Math.round(bearingOf(dx, dy));
    if (b !== st.bearing) setState({ bearing: b });

    // brilho pulsante do lote selecionado
    if (st.focusLot !== highlight.userData.id) {
      const lot = lots.find((l) => l.id === st.focusLot);
      highlight.geometry.dispose();
      if (lot) {
        highlight.geometry = lotGeometry(lot, 1.6);
        highlight.visible = true;
        const c = lotCenters.get(lot.id);
        beam.position.set(c.x, c.y + 45, c.z);
        beam.visible = true;
      } else {
        highlight.geometry = new THREE.BufferGeometry();
        highlight.visible = false;
        beam.visible = false;
      }
      highlight.userData.id = st.focusLot;
    }
    if (highlight.visible) highlight.material.opacity = 0.35 + Math.sin(time * 2.4) * 0.18;

    // leve ondulação do reflexo na água
    water.position.y = 0.15 + Math.sin(time * 0.45) * 0.05;

    renderer.render(scene, camera);
  }

  /* --------------------------- interação ------------------------- */
  window.addEventListener("resize", () => {
    camera.aspect = host.clientWidth / host.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(host.clientWidth, host.clientHeight);
  });
  window.addEventListener("pointermove", (e) => {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -((e.clientY / window.innerHeight) * 2 - 1);
    if (dragging) {
      orbitYawTarget -= (e.clientX - lastPX) * 0.006;
      orbitPitchTarget = THREE.MathUtils.clamp(orbitPitchTarget - (e.clientY - lastPY) * 0.005, PITCH_MIN, PITCH_MAX);
      lastPX = e.clientX;
      lastPY = e.clientY;
    }
  });
  window.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    dragging = true;
    lastPX = e.clientX;
    lastPY = e.clientY;
    document.body.style.cursor = "grabbing";
  });
  const onPointerUp = () => {
    dragging = false;
    document.body.style.cursor = "";
  };
  window.addEventListener("pointerup", onPointerUp);
  window.addEventListener("pointercancel", onPointerUp);

  applySun(state.month, state.hour);
  frame();
  setState({ ready: true });
}

/* A construção da cena é pesada; adiamos alguns quadros para o preloader
   aparecer e animar antes do trabalho síncrono começar. */
setTimeout(() => buildScene($("scene")), 320);
</script>
</body>
