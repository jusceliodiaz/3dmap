     Dependências via CDN: three.js e Google Fonts. Sem build. -->

<style>
:root {
  --bg: #0B121A;
  --ink: #EEF2F4;
  --ink-2: #C3CCD2;
  --muted: #8E9AA3;
  --panel: rgba(11, 18, 26, 0.78);
  --panel-hi: rgba(238, 242, 244, 0.06);
  --line: rgba(238, 242, 244, 0.13);
  --brass: #D4AE62;
  --lake: #6FC3CF;
  --slate: #7A8095;
  --serif: "Spectral", "Iowan Old Style", Georgia, serif;
  --sans: "Public Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg: 16px;
  --edge: 20px;
  --bar-h: 72px;
  --rail-h: 76px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); }
body { font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
::selection { background: var(--brass); color: #1B1408; }

/* ------------------------------ cena 3D ------------------------------ */
#scene { position: fixed; inset: 0; }
#scene canvas { display: block; touch-action: none; cursor: grab; }
#scene.is-dragging canvas { cursor: grabbing; }
#scene.is-pointing canvas { cursor: pointer; }
#scene.is-panning canvas { cursor: move; }
#scene canvas:focus-visible { outline: 2px solid var(--brass); outline-offset: -4px; }

.glass {
  background: var(--panel);
  -webkit-backdrop-filter: blur(16px) saturate(130%);
  backdrop-filter: blur(16px) saturate(130%);
  border: 1px solid var(--line);
}

/* ------------------------------ topo ------------------------------ */
.bar {
  position: fixed; inset: 0 0 auto 0; height: var(--bar-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--edge);
  background: linear-gradient(rgba(8, 12, 18, 0.6), rgba(8, 12, 18, 0));
  pointer-events: none;
}
.bar > * { pointer-events: auto; }
.brand { margin: 0; font: 400 20px/1.1 var(--serif); letter-spacing: -0.01em; }
.brand small { display: block; margin-top: 2px; font: 400 12px/1.3 var(--sans); color: var(--muted); letter-spacing: 0; }
.bar-actions { display: flex; align-items: center; gap: 10px; }

.lang { display: flex; padding: 3px; border-radius: 999px; }
.lang button {
  min-width: 40px; min-height: 34px; padding: 0 10px; border: 0; border-radius: 999px;
  background: none; color: var(--muted); font-size: 13px; cursor: pointer;
  transition: background-color .2s, color .2s;
}
.lang button:hover { color: var(--ink); }
.lang button[aria-pressed="true"] { background: var(--panel-hi); color: var(--ink); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent;
  font-size: 14px; font-weight: 500; text-decoration: none; cursor: pointer;
  transition: background-color .2s, border-color .2s, color .2s;
}
.btn:hover { border-color: rgba(238, 242, 244, 0.38); }
.btn.primary { background: var(--brass); border-color: var(--brass); color: #1B1408; }
.btn.primary:hover { background: #E2BF77; border-color: #E2BF77; }
.btn.block { width: 100%; }

/* ------------------------------ carregamento ------------------------------ */
.loader {
  position: fixed; left: var(--edge); bottom: calc(var(--rail-h) + 12px);
  display: flex; align-items: center; gap: 12px;
  font-size: 13px; color: var(--ink-2);
  transition: opacity .6s;
}
.loader-track { width: 120px; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
.loader-bar { height: 100%; width: 0; background: var(--brass); transition: width .2s ease-out; }
.loader.is-done { opacity: 0; pointer-events: none; }

/* ------------------------------ capítulos ------------------------------ */
.rail {
  position: fixed; left: 50%; bottom: var(--edge); transform: translateX(-50%);
  display: flex; gap: 2px; padding: 4px; border-radius: 999px;
}
.rail button {
  min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px;
  background: none; color: var(--ink-2); font-size: 14px; white-space: nowrap; cursor: pointer;
  transition: background-color .25s, color .25s;
}
.rail button:hover { color: var(--ink); }
.rail button[aria-current="true"] { background: var(--ink); color: var(--bg); }

/* ------------------------------ painel ------------------------------ */
.drawer {
  position: fixed; top: var(--bar-h); right: var(--edge);
  width: 360px; max-height: calc(100dvh - var(--bar-h) - var(--rail-h) - 8px);
  overflow: auto; overscroll-behavior: contain;
  padding: 20px 22px 22px; border-radius: var(--r-lg);
  transition: opacity .25s, transform .35s cubic-bezier(.2, .8, .2, 1);
  scrollbar-width: thin;
}
.drawer.is-closed { opacity: 0; transform: translateX(24px); pointer-events: none; visibility: hidden; transition: opacity .2s, transform .2s, visibility 0s .2s; }
.d-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.d-title { margin: 0; font: 400 26px/1.15 var(--serif); letter-spacing: -0.01em; }
.d-lead { margin: 8px 0 18px; color: var(--ink-2); font-size: 14px; }
.icon-btn {
  flex: none; display: grid; place-items: center; width: 44px; height: 44px; margin: -6px -8px 0 0;
  border: 0; border-radius: 999px; background: none; color: var(--ink-2); cursor: pointer;
}
.icon-btn:hover { background: var(--panel-hi); color: var(--ink); }
.icon-btn svg { width: 18px; height: 18px; }

.tab {
  position: fixed; top: var(--bar-h); right: var(--edge);
  min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 14px; cursor: pointer;
  transition: opacity .25s;
}
.tab.is-hidden { opacity: 0; pointer-events: none; visibility: hidden; }

/* filtros */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 999px; background: none;
  color: var(--ink-2); font-size: 13px; cursor: pointer; transition: border-color .2s, color .2s, background-color .2s;
}
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--panel-hi); color: var(--ink); }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

.field { display: block; margin-top: 18px; }
.field-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-size: 13px; color: var(--ink-2); }
.field-row output { color: var(--ink); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; margin: 0; accent-color: var(--brass); cursor: pointer; }
.note { margin: 8px 0 0; font-size: 13px; color: var(--muted); }

/* ficha do lote */
.card { margin-top: 18px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-hi); }
.card-empty { color: var(--muted); font-size: 14px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.card h3 { margin: 0; font: 400 30px/1 var(--serif); }
.status { padding: 4px 10px; border: 1px solid currentColor; border-radius: 999px; font-size: 12px; white-space: nowrap; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin: 16px 0; }
.facts dt { font-size: 12px; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-size: 17px; font-variant-numeric: tabular-nums; }
.card p { margin: 0 0 16px; font-size: 14px; color: var(--ink-2); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* listas (lazer / rotas) */
.list { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.list li { border-bottom: 1px solid var(--line); }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 8px 4px;
  border: 0; background: none; text-align: left; cursor: pointer;
}
.row:hover .row-t { color: var(--ink); }
.row svg { width: 22px; height: 22px; flex: none; stroke: var(--brass); }
.row-t { flex: 1; color: var(--ink-2); transition: color .2s; }
.row-m { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row[aria-pressed="true"] .row-t { color: var(--brass); }
.row-x { margin: -2px 0 14px 38px; font-size: 14px; color: var(--ink-2); }
.list.static .row { cursor: default; }

/* sol */
.readouts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
.readouts dt { font-size: 12px; color: var(--muted); }
.readouts dd { margin: 2px 0 0; font: 400 22px/1.2 var(--serif); font-variant-numeric: tabular-nums; }
.sunmap { display: block; width: 100%; max-width: 240px; margin: 18px auto 0; }

/* formulário */
.form label { display: block; margin-bottom: 14px; }
.form label span { display: block; margin-bottom: 4px; font-size: 13px; color: var(--ink-2); }
.form label em { font-style: normal; color: var(--muted); }
.form input, .form textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
  background: rgba(0, 0, 0, 0.18); font-size: 15px; outline: none; transition: border-color .2s;
}
.form textarea { resize: vertical; min-height: 84px; }
.form input:focus, .form textarea:focus { border-color: var(--brass); }
.sent { padding: 14px 16px; border: 1px solid var(--brass); border-radius: 12px; color: var(--ink); font-size: 14px; }
.fine { margin: 18px 0 0; font-size: 12px; color: var(--muted); }

/* ------------------------------ marcadores no 3D ------------------------------ */
#pins { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
.pin {
  position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center;
  opacity: 0; pointer-events: none; transition: opacity .3s;
}
.pin.is-on { opacity: 1; }
.pin.is-on .pin-label { pointer-events: auto; }
.pin-label {
  padding: 6px 12px; border-radius: 999px; font-size: 13px; white-space: nowrap; cursor: pointer;
  transition: border-color .2s, color .2s;
}
.pin-label b { margin-left: 6px; font-weight: 500; color: var(--brass); }
.pin-stem { width: 1px; height: 26px; background: linear-gradient(rgba(238, 242, 244, 0.8), rgba(238, 242, 244, 0)); }
.pin.is-active .pin-label, .pin-label:hover { border-color: var(--brass); }
.pin.is-static .pin-label { cursor: default; }
.pin.is-origin .pin-label { border-color: var(--brass); color: var(--brass); }

.tip {
  position: fixed; left: 0; top: 0; padding: 6px 10px; border-radius: 8px;
  font-size: 13px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s;
}
.tip.is-on { opacity: 1; }

/* ------------------------------ bússola ------------------------------ */
.compass {
  position: fixed; right: var(--edge); bottom: var(--edge);
  width: 56px; height: 56px; padding: 0; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  transition: border-color .2s;
}
.compass:hover { border-color: rgba(238, 242, 244, 0.38); }
.compass svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.compass span { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-2); }

/* ------------------------------ mobile ------------------------------ */
/* elementos só do mobile (seletor de capítulo e folha recolhível) */
.switcher, .chapter-grid, .sheet-grip, .d-peek { display: none; }

/* ------------------------------ mobile ------------------------------
   O 3D é o conteúdo: navegação numa pílula compacta (‹ capítulo ›) com grade de capítulos sob demanda,
   e o painel vira uma folha que abre recolhida (alça + título + resumo) e expande com toque ou arraste. */
@media (max-width: 760px) {
  :root { --edge: 10px; --bar-h: 52px; --sheet-bottom: calc(64px + env(safe-area-inset-bottom)); }
  .bar { height: calc(var(--bar-h) + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 12px 0; }
  .brand { font-size: 17px; }
  .brand small { display: none; }
  .bar .btn { display: none; }
  .lang button { min-width: 38px; min-height: 32px; padding: 0 8px; font-size: 12px; }
  .rail { display: none; }

  .switcher {
    position: fixed; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px;
  }
  .switcher button {
    display: grid; place-items: center; min-width: 44px; height: 44px; padding: 0;
    border: 0; border-radius: 999px; background: none; color: var(--ink-2); cursor: pointer;
  }
  .switcher button:active { background: var(--panel-hi); }
  .switcher svg { width: 18px; height: 18px; }
  .switcher .sw-current { min-width: 128px; padding: 0 12px; gap: 1px; line-height: 1.15; color: var(--ink); font-size: 14px; font-weight: 500; }
  .sw-current small { font-size: 12px; font-weight: 400; color: var(--muted); }

  .chapter-grid:not([hidden]) {
    position: fixed; left: 50%; bottom: calc(64px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    width: min(320px, calc(100vw - 20px)); padding: 6px; border-radius: 18px; z-index: 2;
    animation: grid-in .18s ease-out;
  }
  .chapter-grid button {
    min-height: 44px; border: 0; border-radius: 12px; background: none;
    color: var(--ink-2); font-size: 14px; cursor: pointer;
  }
  .chapter-grid button[aria-current="true"] { background: var(--ink); color: var(--bg); }

  .drawer {
    top: auto; left: var(--edge); right: var(--edge); bottom: var(--sheet-bottom);
    width: auto; max-height: 42dvh; padding: 0 16px 16px; border-radius: 20px;
    transition: max-height .32s cubic-bezier(.2, .8, .2, 1), opacity .25s, transform .3s;
    display: flex; flex-direction: column;
  }
  .drawer > * { flex-shrink: 0; }
  /* no celular, a ficha do lote vem logo abaixo do título (antes dos filtros) */
  .sheet-grip { order: -3; }
  .d-head { order: -2; }
  .drawer > .card:not(.card-empty) { order: -1; margin: 10px 0 4px; }
  .drawer.is-peek { max-height: 80px; overflow: hidden; }
  .drawer.is-peek > :not(.d-head):not(.sheet-grip) { display: none; }
  .drawer.is-closed { transform: translateY(16px); }
  .sheet-grip {
    display: block; position: relative; width: 100%; height: 20px; padding: 0;
    border: 0; background: none; cursor: grab; touch-action: none;
  }
  .sheet-grip::before {
    content: ""; position: absolute; left: 50%; top: 8px; width: 36px; height: 4px; margin-left: -18px;
    border-radius: 2px; background: rgba(238, 242, 244, 0.35);
  }
  .d-head { align-items: center; }
  .d-titles { flex: 1; min-width: 0; cursor: pointer; }
  .d-title { font-size: 19px; }
  .d-peek { display: block; margin: 2px 0 0; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drawer:not(.is-peek) .d-peek { display: none; }
  .icon-btn { margin: 0 -8px 0 0; }
  .d-lead { margin: 6px 0 12px; font-size: 13px; }
  .field { margin-top: 12px; }
  .card { margin-top: 12px; padding: 12px; }
  .card h3 { font-size: 24px; }
  .facts { gap: 8px 12px; margin: 12px 0; }
  .facts dd { font-size: 15px; }
  .row { min-height: 46px; }
  .row-t { font-size: 14px; }
  .readouts { margin-top: 14px; padding-top: 12px; }
  .readouts dd { font-size: 18px; }
  .sunmap { max-width: 150px; margin-top: 12px; }

  .tab { top: auto; left: 50%; right: auto; bottom: var(--sheet-bottom); transform: translateX(-50%); font-size: 13px; }
  .loader { display: none; }
  .compass { top: calc(var(--bar-h) + env(safe-area-inset-top) + 6px); bottom: auto; right: var(--edge); width: 44px; height: 44px; }
  .compass span { display: none; }
  .pin-label { padding: 4px 9px; font-size: 12px; }
  .pin-stem { height: 16px; }
  .tip { font-size: 12px; }
}
@keyframes grid-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>

<body>
<div id="scene"></div>
<div id="pins"></div>
<div id="tip" class="tip glass" role="status" aria-live="polite"></div>

<header class="bar">
  <h1 class="brand"><span id="brand-name"></span><small id="brand-place"></small></h1>
  <div class="bar-actions">
    <div class="lang glass" role="group" aria-label="Idioma">
      <button type="button" data-lang="pt" aria-pressed="true">PT</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button type="button" class="btn primary" data-chapter="visita" id="cta"></button>

<div class="loader" id="loader" role="status">

<aside class="drawer glass is-closed" id="drawer" aria-live="polite"></aside>
<button type="button" class="tab glass is-hidden" id="tab" data-action="open-drawer"></button>

<nav class="rail glass" id="rail" aria-label="Capítulos"></nav>
<nav class="switcher glass" id="switcher" aria-label="Capítulos"></nav>
<div class="chapter-grid glass" id="chapter-grid" hidden></div>

<button type="button" class="compass glass" id="compass" data-action="reset-view">
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <g id="rose" style="transform-origin:50px 50px">
      <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(238,242,244,0.18)" />

  <span id="deg" aria-hidden="true">000°</span>
</button>

/* =============================================================================
   MASTERPLAN — vem da foto aérea do empreendimento.
   assets/masterplan.js é gerado por tools/extract_masterplan.py: foto embutida, lotes detectados
   na imagem, máscaras do loteamento e da floresta, portaria e edificações (metros, +y = norte).
   ============================================================================= */
const MP = window.MASTERPLAN;
const NORTH_OFFSET = brand.site.northOffsetDeg;

function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function bearingOf(dx, dy) {
  const deg = (Math.atan2(dx, dy) * 180) / Math.PI;
  return (deg + NORTH_OFFSET + 360) % 360;
}
const octantOf = (bearing) => Math.round(bearing / 45) % 8;

/** Grade 0..1 da foto (uint8 em base64) amostrada com interpolação bilinear em coordenadas de plano. */
function photoGrid({ w, h, data }) {
  const bin = atob(data);
  const v = new Float32Array(bin.length);
  for (let i = 0; i < bin.length; i++) v[i] = bin.charCodeAt(i) / 255;
  const [x0, y0, x1, y1] = MP.extent;
  return (px, py) => {
    const u = ((px - x0) / (x1 - x0)) * (w - 1);
    const r = ((y1 - py) / (y1 - y0)) * (h - 1);   // linha 0 = topo da foto (norte)
    if (u < 0 || r < 0 || u > w - 1 || r > h - 1) return 0;
    const i = Math.floor(u), j = Math.floor(r), fu = u - i, fv = r - j;
    const at = (a, b) => v[Math.min(b, h - 1) * w + Math.min(a, w - 1)];
    return mix(mix(at(i, j), at(i + 1, j), fu), mix(at(i, j + 1), at(i + 1, j + 1), fu), fv);
  };
}
const devAt = photoGrid(MP.devGrid);         // 1 dentro do loteamento
const forestAt = photoGrid(MP.forestGrid);   // 1 onde a foto mostra mata

/** Lotes detectados na foto; quadras = 8 setores em volta do centro, numeradas no sentido horário. */
const lots = (() => {
  const rnd = mulberry32(20260826);
  const sectorOf = (x, y) => Math.floor(((Math.atan2(x, y) * 180) / Math.PI + 360) % 360 / 45);
  const raw = MP.lots.map((l) => {
    const bearing = bearingOf(l.faceVec[0], l.faceVec[1]);
    const roll = rnd();
    return {
      ...l,
      block: "ABCDEFGH"[sectorOf(l.center[0], l.center[1])],
      bearing,
      octant: octantOf(bearing),
      radius: Math.max(...l.polygon.map(([x, y]) => Math.hypot(x - l.center[0], y - l.center[1]))),
      status: roll < 0.5 ? "available" : roll < 0.72 ? "reserved" : "sold",
    };
  });
  const angle = (l) => (Math.atan2(l.center[0], l.center[1]) + Math.PI * 2) % (Math.PI * 2);
  const count = {};
  return raw
    .sort((a, b) => a.block.localeCompare(b.block) || angle(a) - angle(b))
    .map((l) => {
      count[l.block] = (count[l.block] || 0) + 1;
      return { ...l, id: `${l.block}${String(count[l.block]).padStart(2, "0")}` };
    });
})();
const lotById = new Map(lots.map((l) => [l.id, l]));

const summary = {
  total: lots.length,
  available: lots.filter((l) => l.status === "available").length,
  reserved: lots.filter((l) => l.status === "reserved").length,
  sold: lots.filter((l) => l.status === "sold").length,
  avgArea: Math.round(lots.reduce((s, l) => s + l.area, 0) / lots.length),
  minArea: Math.min(...lots.map((l) => l.area)),
  maxArea: Math.max(...lots.map((l) => l.area)),
};

/** Amenidades e edificações nas posições medidas na foto. */
const amenitySpots = Object.fromEntries(Object.entries(MP.amenities).map(([k, [x, y]]) => [k, { x, y }]));

/** Polilinha com cantos arredondados (curva quadrática), reamostrada a cada `step` metros. */
function roundedPolyline(pts, radius, step = 12) {
  const out = [pts[0]];
  let cur = pts[0];
  const lineTo = (a, b) => {
    const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
    for (let i = 1; i <= n; i++) out.push([mix(a[0], b[0], i / n), mix(a[1], b[1], i / n)]);
  };
  for (let i = 1; i < pts.length - 1; i++) {
    const [prev, p, next] = [pts[i - 1], pts[i], pts[i + 1]];
    const d1 = Math.hypot(p[0] - prev[0], p[1] - prev[1]);
    const d2 = Math.hypot(next[0] - p[0], next[1] - p[1]);
    const rr = Math.min(radius, d1 / 2, d2 / 2);
    if (rr < 1) continue;
    const a = [p[0] + ((prev[0] - p[0]) * rr) / d1, p[1] + ((prev[1] - p[1]) * rr) / d1];
    const b = [p[0] + ((next[0] - p[0]) * rr) / d2, p[1] + ((next[1] - p[1]) * rr) / d2];
    lineTo(cur, a);
    for (let k = 1; k <= 10; k++) {
      const t = k / 10, u = 1 - t;
      out.push([u * u * a[0] + 2 * u * t * p[0] + t * t * b[0], u * u * a[1] + 2 * u * t * p[1] + t * t * b[1]]);
    }
    cur = b;
  }
  lineTo(cur, pts[pts.length - 1]);
  return out;
}

/** Trajeto da rota no plano: portaria → estrada de acesso (leste) → contorna pelo norte/sul → destino. */
function routePlan(r) {
  const [ex, ey] = MP.exit;
  const out = [ex + 160, ey];
  return roundedPolyline([MP.gate, MP.exit, out, [out[0], r.to[1]], r.to], 160);
}

function pointInPolygon(x, y, p) {
  let inside = false;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
    const [xi, yi] = p[i];
    const [xj, yj] = p[j];
    if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function lotAtPlan(px, py) {
  for (const l of lots) {
    if (Math.hypot(l.center[0] - px, l.center[1] - py) > l.radius + 1) continue;
    if (pointInPolygon(px, py, l.polygon)) return l;
  }
  return null;
}

/* =============================================================================
   TERRENO
   ============================================================================= */
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const smoothstep = (a, b, x) => {
  const t = clamp01((x - a) / (b - a || 1e-6));
  return t * t * (3 - 2 * t);
};
const mix = (a, b, t) => a + (b - a) * t;

function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}

function valueNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return mix(mix(a, b, u), mix(c, d, u), v) * 2 - 1;
}

function fbm(x, y, octaves = 4) {
  let amp = 1, freq = 1, sum = 0, norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += valueNoise(x * freq, y * freq) * amp;
    norm += amp;
    amp *= 0.5;
    freq *= 2.03;
  }
  return sum / norm;
}

/** 0..1 — dentro da área da foto, com borda suave de 220 m. */
function photoMask(px, py) {
  const [x0, y0, x1, y1] = MP.extent;
  const e = 220;
  return smoothstep(x0, x0 + e, px) * smoothstep(x1, x1 - e, px) * smoothstep(y0, y0 + e, py) * smoothstep(y1, y1 - e, py);
}

/** Altura do terreno em coordenadas de plano (metros). */
function heightAt(px, py) {
  const base = fbm(px * 0.0032, py * 0.0032) * 30 + fbm(px * 0.012, py * 0.012) * 6;
  let h = base + 4;
  // sob a foto o relevo fica contido, para a imagem projetada não deformar
  h = mix(h, h * 0.3 + 3, photoMask(px, py));
  // platô do loteamento
  h = mix(h, 6, devAt(px, py));
  // bairros da cidade: terreno aplainado onde há malha urbana
  return mix(h, h * 0.25 + 3, cityMask(px, py));
}

/** 0..1 — quanto um ponto do plano está dentro de algum bairro da cidade. */
function cityMask(px, py) {
  let m = 0;
  for (const d of DISTRICTS) {
    const dist = Math.hypot(px - d.x, py - d.y);
    if (dist < d.r * 1.3) m = Math.max(m, smoothstep(d.r * 1.3, d.r * 0.75, dist));
  }
  return m;
}

const routePlans = Object.fromEntries(routes.map((r) => [r.id, routePlan(r)]));

/* =============================================================================
   SOLAR
   ============================================================================= */
function sunPosition(latitude, month, hour) {
  const dayOfYear = Math.round((month + 0.5) * 30.44);
  const decl = 23.44 * Math.sin(((2 * Math.PI) / 365) * (dayOfYear - 81));
  const rad = Math.PI / 180;
  const H = (hour - 12) * 15 * rad;
  const lat = latitude * rad;
  const d = decl * rad;
  const sinAlt = Math.sin(lat) * Math.sin(d) + Math.cos(lat) * Math.cos(d) * Math.cos(H);
  const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
  const cosAz = (Math.sin(d) - Math.sin(alt) * Math.sin(lat)) / (Math.cos(alt) * Math.cos(lat) || 1e-6);
  let az = Math.acos(Math.max(-1, Math.min(1, cosAz))) / rad;
  if (H > 0) az = 360 - az;
  return { azimuth: az, altitude: alt / rad };
}

function sunPath(latitude, month, step = 0.25) {
  const pts = [];
  for (let h = 0; h <= 24; h += step) pts.push(sunPosition(latitude, month, h));
  return pts;
}

let gripY = null;

document.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".sheet-grip, .d-titles")) {
    gripY = e.clientY;
    gripSwiped = false;
  }
});
document.addEventListener("pointerup", (e) => {
  if (gripY === null) return;
  const dy = e.clientY - gripY;

  gripSwiped = true;

const fmtHour = (h) => `${String(Math.floor(h)).padStart(2, "0")}:${String(Math.round((h % 1) * 60)).padStart(2, "0")}`;

/** Resumo de uma linha mostrado com o painel recolhido no mobile. */
function peekText() {
  const lang = state.lang;
  if (state.chapter === "lotes") {
    const l = state.focusLot && lotById.get(state.focusLot);
    return l ? `${t().lots.lot} ${l.id}, ${l.area} m², ${t().lots[l.status].toLowerCase()}` : t().peek.lotes(summary.available);
  }
  if (state.chapter === "lazer") {
    const a = amenities.find((x) => x.id === state.focusAmen);
    return a ? `${a.title[lang]}, ${a.meta[lang]}` : t().peek.lazer(amenities.length);
  }
  if (state.chapter === "rotas") {
    const r = routes.find((x) => x.id === state.route);
    return `${r.title[lang]}, ${t().routes.meta(r)}`;
  }
  if (state.chapter === "sol") return `${MONTHS[lang][state.month]}, ${fmtHour(state.hour)}`;
  if (state.chapter === "visita") return t().peek.visita;
  return "";
}

/** Projeção simples do céu: horizonte na borda, zênite no centro. */
function project(azimuth, altitude, R = 80) {
  const r = R * (1 - Math.max(0, altitude) / 90);
  const a = ((azimuth - 90) * Math.PI) / 180;
  return [round(Math.cos(a) * r), round(Math.sin(a) * r)];
}
const sunPathD = (month, step) =>
  sunPath(brand.site.latitude, month, step).filter((p) => p.altitude > -1).map((p, i) => {
    const [x, y] = project(p.azimuth, p.altitude);
    return `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");

    </dl>
    <p class="note" id="sol-night">${S.night}</p>
    <svg class="sunmap" viewBox="-104 -104 208 208" aria-hidden="true">
      <circle r="80" fill="rgba(111,195,207,0.05)" stroke="rgba(238,242,244,0.18)" />
      <circle r="53" fill="none" stroke="rgba(238,242,244,0.08)" stroke-dasharray="2 5" />
      <circle r="27" fill="none" stroke="rgba(238,242,244,0.08)" stroke-dasharray="2 5" />
      ${labels}

const DRAWERS = { lotes: lotsDrawer, lazer: amenDrawer, rotas: routesDrawer, sol: sunDrawer, visita: visitDrawer };

function renderDrawer() {
  const el = $("drawer");

  const scroll = el.scrollTop;
  el.innerHTML = make();
  el.setAttribute("aria-labelledby", "drawer-title");
  el.scrollTop = scroll;

  if (state.chapter === "lotes") {
    $("min-area").addEventListener("input", (e) => setState({ minArea: Number(e.target.value) }));
  }
  if (state.chapter === "sol") {
    $("sol-month-in").addEventListener("input", (e) => setState({ month: Number(e.target.value) }));
    $("sol-hour-in").addEventListener("input", (e) => setState({ hour: Number(e.target.value) }));
    updateSolar();
  }
  if (state.chapter === "visita" && !state.sent) {
    $("visit-form").addEventListener("submit", (e) => {

function updateDrawerVisibility() {
  const has = Boolean(DRAWERS[state.chapter]);
  const drawer = $("drawer");
  drawer.classList.toggle("is-closed", !(has && state.drawer));
  drawer.classList.toggle("is-peek", !state.sheetFull);
  const grip = drawer.querySelector(".sheet-grip");
  if (grip) {
    grip.setAttribute("aria-expanded", String(state.sheetFull));
    grip.setAttribute("aria-label", state.sheetFull ? t().collapsePanel : t().expandPanel);
  }
  const tab = $("tab");
  tab.classList.toggle("is-hidden", !(has && !state.drawer));
  tab.textContent = has ? t().showPanel(t().chapters[state.chapter]) : "";
}

function updateLotFilterReadout() {
  const out = $("min-out"), count = $("match-count");
  if (out) out.textContent = `${state.minArea} m²`;
  if (count) count.textContent = t().lots.matches(lots.filter(lotMatches).length);
}

function updateSolar() {
  if (!$("sol-month")) return;
  const { month, hour } = state;
  const now = sunPosition(brand.site.latitude, month, hour);
  const above = now.altitude > 0;
  const [sx, sy] = project(now.azimuth, Math.max(now.altitude, 0));
  $("sol-month").textContent = MONTHS[state.lang][month];
  $("sol-hour").textContent = fmtHour(hour);
  const peek = $("drawer-peek");
  if (peek) peek.textContent = peekText();
  $("sol-az").textContent = `${Math.round(now.azimuth)}°`;
  $("sol-alt").textContent = `${Math.round(now.altitude)}°`;
  $("sol-dir").textContent = above ? OCTANT_LABELS[state.lang][Math.round(now.azimuth / 45) % 8] : "—";
  $("sol-night").hidden = above;
  $("sol-path").setAttribute("d", sunPathD(month, 0.2));
  $("sol-sun").style.display = above ? "" : "none";
  for (const id of ["sol-halo", "sol-dot"]) {
    $(id).setAttribute("cx", sx);
    $(id).setAttribute("cy", sy);
  }
  $("sol-ray").setAttribute("x2", sx);
  $("sol-ray").setAttribute("y2", sy);
}

const pins = [

function renderPins() {
  const layer = $("pins");
  layer.innerHTML = "";
  for (const p of pins) {
    const el = document.createElement("div");
    el.className = `pin${p.key === "origin" ? " is-static is-origin" : ""}`;
    if (p.group === "lazer") {
      const a = amenities.find((x) => x.id === p.key);
      el.innerHTML = `<button type="button" class="pin-label glass" data-amen="${p.key}" tabindex="-1">${a.title[state.lang]}</button><span class="pin-stem"></span>`;
    } else if (p.key === "origin") {
      el.innerHTML = `<span class="pin-label glass">${t().routes.from}</span><span class="pin-stem"></span>`;
    } else {
      const r = routes.find((x) => x.id === p.key);
      el.innerHTML = `<button type="button" class="pin-label glass" data-route="${p.key}" tabindex="-1">${r.title[state.lang]}<b>${r.min} ${t().routes.min}</b></button><span class="pin-stem"></span>`;
    }
    p.el = el;
    p.on = false;
    layer.appendChild(el);
  }
  updatePinState();
}

function updatePinState() {
  for (const p of pins) {
    p.el?.classList.toggle("is-active", (p.group === "lazer" && state.focusAmen === p.key) || (p.group === "rotas" && state.route === p.key));

  const el = e.target.closest("[data-lang],[data-chapter],[data-filter],[data-amen],[data-route],[data-action]");
  if (!el) return;
  const d = el.dataset;
  if (d.lang) setState({ lang: d.lang });
  else if (d.chapter) setChapter(d.chapter);
  else if (d.filter) setState({ filter: d.filter });
  else if (d.amen) {
    if (state.chapter !== "lazer") setChapter("lazer");
    setState({ focusAmen: state.focusAmen === d.amen ? null : d.amen, drawer: true, sheetFull: true });
  } else if (d.route) {
    if (state.chapter !== "rotas") setChapter("rotas");
    if (state.route === d.route) sceneApi?.playRoute();
    setState({ route: d.route, drawer: true });
  } else if (d.action === "replay-route") sceneApi?.playRoute();
  else if (d.action === "toggle-sheet") {
    if (gripSwiped) gripSwiped = false;   // o arraste já tratou
    else setState({ sheetFull: !state.sheetFull });
  } else if (d.action === "toggle-chapters") setState({ chapterMenu: !state.chapterMenu });
  else if (d.action === "prev-chapter" || d.action === "next-chapter") {
    const i = CHAPTERS.indexOf(state.chapter) + (d.action === "next-chapter" ? 1 : -1);
    setChapter(CHAPTERS[(i + CHAPTERS.length) % CHAPTERS.length]);
  }
  else if (d.action === "reset-view") sceneApi?.resetView();
  else if (d.action === "close-drawer") setState({ drawer: false });
  else if (d.action === "open-drawer") setState({ drawer: true });
  else if (d.action === "clear-lot") setState({ focusLot: null });
  else if (d.action === "want-lot") {
    setState({ interest: t().lots.interest(state.focusLot), sent: false });
    setChapter("visita");
  }
});

document.addEventListener("keydown", (e) => {

    setChapter(CHAPTERS[Number(e.key) - 1]);

  if (e.key !== "Escape") return;
  if (state.chapterMenu) setState({ chapterMenu: false });
  else if (state.focusLot || state.focusAmen) setState({ focusLot: null, focusAmen: null });
  else if (state.drawer && DRAWERS[state.chapter]) setState({ drawer: false });
});

    if (state.ready) return;
    const e = (performance.now() - t0) / 1000;
    $("loader-bar").style.width = `${Math.min(92, 92 * (1 - Math.exp(-e / 1.2)))}%`;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

/* =============================================================================
   CENA 3D
   ============================================================================= */
/* plano (x,y) -> mundo (x, altura, -y) */
const wx = (px) => px;
const wz = (py) => -py;
const toVec = (p) => new THREE.Vector3(wx(p[0]), p[2], wz(p[1]));
const UP = new THREE.Vector3(0, 1, 0);

const STATUS_COLOR = { available: 0xd4ae62, reserved: 0x6fc3cf, sold: 0x7a8095 };
const FILL_OPACITY = { available: 0.26, reserved: 0.18, sold: 0.09 };
const LINE_OPACITY = { available: 0.6, reserved: 0.6, sold: 0.28 };

/* roteiro do sobrevoo: [x, y, altura] no plano */
const CAM_PLAN = [
  [1100, -900, 650],
  [700, -560, 380],
  [300, -500, 230],
  [-350, -420, 240],
  [-720, 0, 290],
  [-320, 540, 270],
  [350, 430, 250],
  [900, 160, 330],
  [800, -520, 520],
];
const LOOK_PLAN = [
  [0, 0, 6],
  [0, -60, 6],
  [-50, -180, 6],
  [-250, -120, 6],
  [-300, 40, 6],
  [-60, 200, 6],
  [250, 40, 6],
  [300, 0, 8],
  [0, 0, 6],
];

/* enquadramento fixo de cada capítulo */
const POSES = {
  lotes: { pos: [80, -720, 920], look: [-30, 0, 0] },
  lazer: { pos: [640, -440, 340], look: [250, -20, 6] },
  rotas: { pos: [900, -3200, 2900], look: [0, -200, 0] },
  sol: { pos: [900, 520, 620], look: [0, 0, 8] },
  visita: { pos: [820, -90, 190], look: [400, -10, 6] },
};

function buildScene(host) {
  const clock = new THREE.Clock();

  /* Navegação: câmera orbital (alvo + yaw/pitch/raio).
     `base` segue o enquadramento do roteiro, do capítulo ou do foco; `user` guarda o que o
     visitante girou, aproximou ou moveu por cima dele. Tudo amortecido por tempo, não por quadro. */
  const PITCH_MIN = 0.1;    // ~6° acima do horizonte
  const PITCH_MAX = 1.38;   // ~79°, quase zenital
  const RADIUS_MIN = 45;
  const RADIUS_MAX = 5200;
  const PAN_MAX = 2600;
  const base = { target: new THREE.Vector3(), yaw: 0, pitch: 0.5, radius: 600, ready: false };
  const user = { yaw: 0, pitch: 0, zoom: 1, pan: new THREE.Vector3() };
  const shown = { yaw: 0, pitch: 0, zoom: 1, pan: new THREE.Vector3() };
  const vel = { yaw: 0, pitch: 0 };   // inércia depois de soltar
  const view = { yaw: 0, pitch: 0.5, radius: 600 };
  const viewShift = { x: 0, y: 0 };    // deslocamento do centro óptico (px) quando há painel aberto
  const pointers = new Map();
  let gesture = null;                  // "orbit" | "pan" | "pinch"
  let downX = 0, downY = 0, moved = 0, lastMoveT = 0;
  let pinchDist = 0;
  const pinchMid = { x: 0, y: 0 };
  let flightDir = 1;
  let hoverReq = null;

  /* Qualidade: desktop recebe AO, sombra 4096 e reflexo em resolução maior; celular, o básico. */
  const HQ = !coarsePointer && Math.min(window.innerWidth, window.innerHeight) > 600;

  const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, HQ ? 1.5 : 1.25));
  renderer.setSize(host.clientWidth, host.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.62;
  renderer.domElement.setAttribute("role", "img");
  renderer.domElement.setAttribute("aria-label", t().canvas);
  host.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, host.clientWidth / host.clientHeight, 2, 22000);
  camera.position.copy(toVec(CAM_PLAN[0]));

  // perspectiva aérea: névoa exponencial com a cor do horizonte (ajustada pelo sol em applySun)
  const fogColor = new THREE.Color(0xa7b7c8);
  scene.fog = new THREE.FogExp2(fogColor, 0.000085);

  /* ------------------------------- céu ------------------------------- */
  // céu físico (dispersão de Rayleigh/Mie): é o fundo e também a fonte de luz ambiente da cena
  const sunDir = new THREE.Vector3(0.4, 0.5, 0.6).normalize();
  const sky = new Sky();
  sky.scale.setScalar(20000);
  const skyU = sky.material.uniforms;
  skyU.turbidity.value = 5.5;
  skyU.rayleigh.value = 1.4;
  skyU.mieCoefficient.value = 0.004;
  skyU.mieDirectionalG.value = 0.82;
  scene.add(sky);

  /* ------------------------------ luzes ------------------------------ */
  // sol: única luz direta. O preenchimento vem do céu (IBL); o hemisfério só simula o rebote do chão verde.
  const sun = new THREE.DirectionalLight(0xfff1dd, 4.2);
  sun.castShadow = true;
  sun.shadow.mapSize.set(HQ ? 4096 : 2048, HQ ? 4096 : 2048);
  const sc = sun.shadow.camera;
  sc.near = 10;
  sc.far = 7000;
  sun.shadow.bias = -0.00015;
  scene.add(sun, sun.target);
  const bounce = new THREE.HemisphereLight(0xbcd2ee, 0x3b4a2a, 0.35);
  scene.add(bounce);

  const pmrem = new THREE.PMREMGenerator(renderer);
  let envRT = null;
  const envScene = new THREE.Scene();
  const envSky = new THREE.Mesh(sky.geometry, sky.material);
  envSky.scale.setScalar(50);
  envScene.add(envSky);
  const refreshEnv = () => {
    envRT?.dispose();
    envRT = pmrem.fromScene(envScene, 0.03);
    scene.environment = envRT.texture;
  };

  /* --------------------------- pós-processamento --------------------------- */
  // RenderPass → GTAO (oclusão de contato) → bloom (só o que é muito brilhante) → OutputPass (tone map + sRGB)
  const composerTarget = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
  const composer = new EffectComposer(renderer, composerTarget);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(host.clientWidth, host.clientHeight);
  composer.addPass(new RenderPass(scene, camera));
  let gtao = null;
  if (HQ) {
    gtao = new GTAOPass(scene, camera, host.clientWidth, host.clientHeight);
    gtao.updateGtaoMaterial({ radius: 9, distanceExponent: 1.4, thickness: 6, scale: 1.1, samples: 16 });
    gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
    gtao.blendIntensity = 0.9;
    composer.addPass(gtao);
  }
  const bloom = new UnrealBloomPass(new THREE.Vector2(host.clientWidth, host.clientHeight), 0.32, 0.55, 0.92);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  /* ----------------------------- terreno ----------------------------- */
  // 9,6 km de lado: loteamento no centro e a cidade em volta
  const terrainGeo = new THREE.PlaneGeometry(9600, 9600, 520, 520);
  terrainGeo.rotateX(-Math.PI / 2);
  {
    const pos = terrainGeo.attributes.position;
    const mask = new Float32Array(pos.count * 2);   // x: malha urbana, y: presença da foto (borda suave)
    for (let i = 0; i < pos.count; i++) {
      const px = pos.getX(i);
      const py = -pos.getZ(i);
      const r = Math.hypot(px, py);
      // beira do mapa desce para o horizonte
      pos.setY(i, heightAt(px, py) - Math.max(0, r - 3900) * 0.08);
      mask[i * 2] = cityMask(px, py);
      mask[i * 2 + 1] = photoMask(px, py);
    }
    terrainGeo.setAttribute("aMask", new THREE.BufferAttribute(mask, 2));
    terrainGeo.computeVertexNormals();
  }
  const terrainMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, metalness: 0 });
  // foto aérea do empreendimento projetada de cima no relevo (planar, em metros)
  const photo = new THREE.TextureLoader().load(MP.image);
  photo.colorSpace = THREE.SRGBColorSpace;
  photo.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const photoUniforms = {
    uPhoto: { value: photo },
    uExtent: { value: new THREE.Vector4(...MP.extent) },
    uForest: { value: new THREE.Color(0.03, 0.05, 0.022) },   // trocada pela média real da mata da foto
  };
  // cor média da mata na foto (só onde a máscara de floresta é alta), para continuar a mata fora da imagem
  {
    const img = new Image();
    img.onload = () => {
      const { w, h } = MP.forestGrid;
      const cv = document.createElement("canvas");
      cv.width = w;
      cv.height = h;
      const ctx = cv.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      const px = ctx.getImageData(0, 0, w, h).data;
      const mask = atob(MP.forestGrid.data);
      const sum = [0, 0, 0];
      let n = 0;
      for (let i = 0; i < w * h; i++) {
        if (mask.charCodeAt(i) < 200) continue;
        for (let k = 0; k < 3; k++) sum[k] += px[i * 4 + k];
        n++;
      }
      if (n) photoUniforms.uForest.value.setRGB(sum[0] / n / 255, sum[1] / n / 255, sum[2] / n / 255, THREE.SRGBColorSpace);
    };
    img.src = MP.image;
  }
  // fora da foto: albedo realista (valores lineares de grama, capim seco, terra roxa, rocha e solo urbano),
  // variado por ruído em duas escalas para quebrar a repetição
  terrainMat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, photoUniforms);
    shader.vertexShader = shader.vertexShader
      .replace("#include <common>", "#include <common>\nattribute vec2 aMask; varying vec2 vMask; varying vec3 vWp; varying vec3 vN2;")
      .replace("#include <begin_vertex>", "#include <begin_vertex>\nvMask = aMask; vWp = position; vN2 = normal;");
    shader.fragmentShader = shader.fragmentShader
      .replace(
        "#include <common>",
        `#include <common>
         varying vec2 vMask; varying vec3 vWp; varying vec3 vN2;
         uniform sampler2D uPhoto; uniform vec4 uExtent; uniform vec3 uForest;
         float th(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
         float tn(vec2 p) {
           vec2 i = floor(p), f = fract(p);
           vec2 u = f * f * (3.0 - 2.0 * f);
           return mix(mix(th(i), th(i + vec2(1, 0)), u.x), mix(th(i + vec2(0, 1)), th(i + vec2(1, 1)), u.x), u.y);
         }`
      )
      .replace(
        "#include <color_fragment>",
        `#include <color_fragment>
         vec2 q = vWp.xz;
         float big = tn(q * 0.0035) * 0.6 + tn(q * 0.011) * 0.4;
         float fine = tn(q * 0.09) * 0.5 + tn(q * 0.37) * 0.5;
         vec3 grass = vec3(0.045, 0.075, 0.028);
         vec3 dry   = vec3(0.090, 0.092, 0.040);
         vec3 soil  = vec3(0.150, 0.075, 0.042);
         vec3 rock  = vec3(0.105, 0.098, 0.088);
         vec3 urban = vec3(0.085, 0.082, 0.078);
         vec3 c = mix(grass, dry, smoothstep(0.62, 0.9, big) * 0.8);
         c *= 0.85 + 0.3 * fine;
         float slope = 1.0 - clamp(vN2.y, 0.0, 1.0);
         c = mix(c, soil, smoothstep(0.32, 0.55, slope) * (0.35 + 0.4 * fine));
         c = mix(c, rock, smoothstep(0.5, 0.8, slope));
         c = mix(c, urban * (0.9 + 0.2 * fine), vMask.x * 0.9);
         // foto: plano (x, -z) -> uv; norte (yMax) no topo da imagem
         vec2 pp = vec2(vWp.x, -vWp.z);
         vec2 puv = (pp - uExtent.xy) / (uExtent.zw - uExtent.xy);
         // fora da foto a mata continua com a cor da própria foto (borda esticada e borrada),
         // manchada por ruído e rareando com a distância, sem contorno reto
         float blob = tn(pp * 0.0016 + 3.1) * 0.6 + tn(pp * 0.006) * 0.4;
         vec2 outside = max(max(uExtent.xy - pp, pp - uExtent.zw), 0.0);
         float belt = 1.0 - smoothstep(150.0, 1600.0, length(outside) + (blob - 0.5) * 1100.0);
         float crowns = tn(pp * 0.14) * 0.6 + tn(pp * 0.045) * 0.4;   // copas de ~7 m e grupos de árvores
         vec3 canopy = uForest * (0.55 + 0.9 * crowns) * (0.8 + 0.4 * blob);
         c = mix(c, canopy, belt * (1.0 - vMask.x));
         // a foto entra por uma borda larga e irregular (não pelo retângulo)
         vec2 inside = min(pp - uExtent.xy, uExtent.zw - pp);
         float edge = smoothstep(0.0, 260.0, min(inside.x, inside.y) + (blob - 0.5) * 420.0);
         c = mix(c, texture2D(uPhoto, puv).rgb, edge);
         diffuseColor.rgb = c;`
      );
  };
  const terrain = new THREE.Mesh(terrainGeo, terrainMat);
  terrain.receiveShadow = true;
  terrain.castShadow = true;   // colinas projetam sombra no fim da tarde
  scene.add(terrain);

  // lago, vias e áreas comuns do loteamento vêm da própria foto projetada no terreno

  /* ------------------------------- lotes ----------------------------- */
  const lotGeo = new Map();     // geometria de cada lote, reaproveitada por realce e filtro
  const lotCenters = new Map();
  lots.forEach((l) => {
    const g = new THREE.ShapeGeometry(new THREE.Shape(l.polygon.map(([x, y]) => new THREE.Vector2(x, y))), 2);
    g.rotateX(-Math.PI / 2);
    const pos = g.attributes.position;
    for (let i = 0; i < pos.count; i++) pos.setY(i, heightAt(pos.getX(i), -pos.getZ(i)) + 1.3);
    g.computeVertexNormals();
    lotGeo.set(l.id, g);
    lotCenters.set(l.id, new THREE.Vector3(wx(l.center[0]), heightAt(l.center[0], l.center[1]), wz(l.center[1])));
  });

  const baseFill = {};
  const baseLines = {};
  const filterFill = {};
  ["available", "reserved", "sold"].forEach((status) => {
    const subset = lots.filter((l) => l.status === status);
    baseFill[status] = new THREE.Mesh(
      mergeGeometries(subset.map((l) => lotGeo.get(l.id)), false),
      new THREE.MeshBasicMaterial({ color: STATUS_COLOR[status], transparent: true, opacity: FILL_OPACITY[status], depthWrite: false })
    );
    scene.add(baseFill[status]);

    const linePts = [];
    subset.forEach((l) => {
      const pts = l.polygon;
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i];
        const b = pts[(i + 1) % pts.length];
        linePts.push(wx(a[0]), heightAt(a[0], a[1]) + 1.6, wz(a[1]));
        linePts.push(wx(b[0]), heightAt(b[0], b[1]) + 1.6, wz(b[1]));
      }
    });
    const lg = new THREE.BufferGeometry();
    lg.setAttribute("position", new THREE.Float32BufferAttribute(linePts, 3));
    baseLines[status] = new THREE.LineSegments(
      lg,
      new THREE.LineBasicMaterial({ color: STATUS_COLOR[status], transparent: true, opacity: LINE_OPACITY[status] })
    );
    scene.add(baseLines[status]);

    filterFill[status] = new THREE.Mesh(
      new THREE.BufferGeometry(),
      new THREE.MeshBasicMaterial({ color: STATUS_COLOR[status], transparent: true, opacity: 0.6, depthWrite: false })
    );
    filterFill[status].position.y = 0.2;
    filterFill[status].visible = false;
    scene.add(filterFill[status]);
  });

  /** Filtros da UI: apaga o loteamento e acende só os lotes que correspondem.
      Fora do capítulo Lotes as camadas somem e fica só a foto do empreendimento. */
  function applyFilter() {
    const active = filterActive();
    const k = state.chapter === "lotes" ? 1 : 0;
    ["available", "reserved", "sold"].forEach((status) => {
      baseFill[status].material.opacity = FILL_OPACITY[status] * k * (active ? 0.3 : 1);
      baseLines[status].material.opacity = LINE_OPACITY[status] * k * (active ? 0.3 : 1);
      baseFill[status].visible = baseLines[status].visible = k > 0;
      const subset = lots.filter((l) => l.status === status && lotMatches(l));
      filterFill[status].geometry.dispose();
      filterFill[status].geometry = active && subset.length
        ? mergeGeometries(subset.map((l) => lotGeo.get(l.id)), false)
        : new THREE.BufferGeometry();
      filterFill[status].visible = k > 0 && active && subset.length > 0;
    });
  }

  // realce do lote selecionado e do lote sob o cursor (geometrias compartilhadas — não descartar)
  const highlight = new THREE.Mesh(
    new THREE.BufferGeometry(),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55, depthWrite: false })
  );
  highlight.position.y = 0.6;
  highlight.visible = false;
  scene.add(highlight);
  const hover = new THREE.Mesh(
    new THREE.BufferGeometry(),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.22, depthWrite: false })
  );
  hover.position.y = 0.4;
  hover.visible = false;
  scene.add(hover);
  const beam = new THREE.Mesh(
    new THREE.CylinderGeometry(1.2, 1.2, 90, 12, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xffe6b0, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false })
  );
  beam.visible = false;
  scene.add(beam);

  /* ------------------------------ árvores ---------------------------- */
  // duas espécies (copa cônica e copa arredondada), cor variando por instância
  const coniferGeo = mergeGeometries(
    [
      new THREE.ConeGeometry(3.2, 9, 7).translate(0, 6.5, 0),
      new THREE.CylinderGeometry(0.45, 0.65, 3, 6).translate(0, 1.5, 0),
    ],
    false
  );
  const broadGeo = mergeGeometries(
    [
      new THREE.IcosahedronGeometry(4.2, 1).scale(1, 0.82, 1).translate(0, 7.2, 0),
      // Icosahedron não é indexado; o tronco precisa do mesmo formato para o merge
      new THREE.CylinderGeometry(0.45, 0.7, 4.5, 6).translate(0, 2.25, 0).toNonIndexed(),
    ],
    false
  );
  const TREES = 13000;
  /** Densidade de mata 0..1: manchas orgânicas (ruído) que rareiam com a distância do loteamento.
      Não conhece o retângulo da foto: a floresta da imagem continua para fora sem contorno. */
  function forestDensity(px, py) {
    const warp = fbm(px * 0.0011 + 11.3, py * 0.0011 - 4.7) * 900;
    const reach = 1 - smoothstep(900, 3300, Math.hypot(px, py) + warp);
    const groves = smoothstep(-0.25, 0.35, fbm(px * 0.0024 + 7.1, py * 0.0024 + 1.9));
    const clearings = smoothstep(0.15, 0.45, fbm(px * 0.006 - 3.3, py * 0.006 + 8.8));
    return clamp01(reach * (0.35 + 0.65 * groves) * (1 - 0.7 * clearings));
  }
  const treeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.88, metalness: 0 });
  const treeKinds = [coniferGeo, broadGeo].map((g) => {
    const m = new THREE.InstancedMesh(g, treeMat, TREES);
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  });
  const treeTint = new THREE.Color();
  {
    const dummy = new THREE.Object3D();
    const placedBy = [0, 0];
    let placed = 0;
    let guard = 0;
    while (placed < TREES && guard < TREES * 40) {
      guard++;
      const px = mix(-3600, 3600, Math.random());
      const py = mix(-3600, 3600, Math.random());
      // fora do loteamento, da cidade e das áreas abertas da foto (lago, gramados, vias)
      if (devAt(px, py) > 0.05 || cityMask(px, py) > 0.15) continue;
      const inPhoto = photoMask(px, py);
      if (inPhoto > 0.5 && forestAt(px, py) < 0.45) continue;
      if (Math.random() > forestDensity(px, py)) continue;
      // copas maiores perto da mata nativa, menores e mais variadas longe dela
      const s = mix(0.7, 1.15, forestDensity(px, py)) + Math.random() * 0.8;
      const h = heightAt(px, py);
      dummy.position.set(wx(px), h - 0.3, wz(py));
      dummy.scale.set(s, s * (0.8 + Math.random() * 0.6), s);
      dummy.rotation.y = Math.random() * Math.PI;
      dummy.updateMatrix();
      const kind = Math.random() < 0.45 ? 0 : 1;
      const mesh = treeKinds[kind];
      // verdes lineares de folhagem, do escuro (conífera) ao oliva (folhosa)
      treeTint.setRGB(
        (kind ? 0.06 : 0.035) + Math.random() * 0.03,
        (kind ? 0.10 : 0.07) + Math.random() * 0.04,
        0.025 + Math.random() * 0.02,
        THREE.LinearSRGBColorSpace
      );
      mesh.setMatrixAt(placedBy[kind], dummy.matrix);
      mesh.setColorAt(placedBy[kind], treeTint);
      placedBy[kind]++;
      placed++;
    }
    treeKinds.forEach((m, i) => {
      m.count = placedBy[i];
      m.instanceMatrix.needsUpdate = true;
      m.instanceColor.needsUpdate = true;
      scene.add(m);
    });
  }

  /* --------------------------- edificações ---------------------------- */
  const amenCenters = Object.fromEntries(
    Object.entries(amenitySpots).map(([k, p]) => [k, new THREE.Vector3(wx(p.x), heightAt(p.x, p.y), wz(p.y))])
  );
  // vidro reflexivo (reflete o céu pelo IBL); acende à noite em applySun
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0x1a2630, roughness: 0.05, metalness: 0.2, clearcoat: 1, clearcoatRoughness: 0.05,
    emissive: 0xffc98a, emissiveIntensity: 0,
  });
  // volumes nas posições e tamanhos medidos na foto: fachada clara, faixa de vidro e cobertura na cor vista de cima
  MP.buildings.forEach((b) => {
    const [w, d] = b.size;
    const g = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(w, b.height, d),
      new THREE.MeshStandardMaterial({ color: b.wall, roughness: 0.8, metalness: 0 })
    );
    body.position.y = b.height / 2;
    const band = new THREE.Mesh(new THREE.BoxGeometry(w * 1.005, b.height * 0.32, d * 1.005), glassMat);
    band.position.y = b.height * 0.5;
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(w * 1.06, 0.6, d * 1.06),
      new THREE.MeshStandardMaterial({ color: b.roof, roughness: 0.65, metalness: 0.1 })
    );
    roof.position.y = b.height + 0.3;
    [body, roof].forEach((m) => { m.castShadow = true; m.receiveShadow = true; });
    g.add(body, band, roof);
    g.position.set(wx(b.center[0]), heightAt(b.center[0], b.center[1]), wz(b.center[1]));
    g.rotation.y = -b.rot;   // rotação medida na imagem (y para baixo) -> giro anti-horário no plano
    scene.add(g);
  });

  /* ------------------------------ cidade ------------------------------ */
  /** Faixa aberta (rua, rodovia ou rota) acompanhando o relevo. */
  function strip(points, width, lift) {
    const verts = [];
    const idx = [];
    const n = points.length;
    for (let i = 0; i < n; i++) {
      const [x, y] = points[i];
      const [nx, ny] = points[Math.min(i + 1, n - 1)];
      const [bx, by] = points[Math.max(i - 1, 0)];
      let tx = nx - bx;
      let ty = ny - by;
      const len = Math.hypot(tx, ty) || 1;
      tx /= len; ty /= len;
      const ox = (-ty * width) / 2;
      const oy = (tx * width) / 2;
      verts.push(wx(x + ox), heightAt(x + ox, y + oy) + lift, wz(y + oy));
      verts.push(wx(x - ox), heightAt(x - ox, y - oy) + lift, wz(y - oy));
    }
    for (let i = 0; i < n - 1; i++) {
      const a = i * 2;
      idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }
  const segment = (a, b, step = 20) => roundedPolyline([a, b], 0, step);
  function distToSegment(px, py, [ax, ay], [bx, by]) {
    const dx = bx - ax, dy = by - ay;
    const k = THREE.MathUtils.clamp(((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy), 0, 1);
    return Math.hypot(px - (ax + dx * k), py - (ay + dy * k));
  }

  routes.forEach((r) => streetGeos.push(strip(routePlans[r.id], 12, 0.8)));
  const cityRoads = new THREE.Mesh(
    mergeGeometries(streetGeos, false),

    distToSegment(px, py, HIGHWAY[0], HIGHWAY[1]) < clear + 10 ||

  const bRnd = mulberry32(4242);
  const bMatrices = [];
  const bColors = [];
  const dummyB = new THREE.Object3D();
  DISTRICTS.forEach((d) => {
    const toPlan = districtFrame(d);
    const cells = Math.floor((2 * d.r) / CITY_STEP);
    for (let i = 0; i <= cells; i++) {
      for (let j = 0; j <= cells; j++) {
        if (i % 4 === 0 || j % 4 === 0) continue; // ruas
        const u = -d.r + i * CITY_STEP;
        const v = -d.r + j * CITY_STEP;

  const cityUniforms = { night: { value: 0 } };
  const buildingGeo = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
  buildingGeo.setAttribute("wuv", buildingGeo.attributes.uv.clone());
  const buildingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.74, metalness: 0.05 });
  // janelas acesas nas fachadas, mais visíveis conforme o sol se põe

  const buildings = new THREE.InstancedMesh(buildingGeo, buildingMat, bMatrices.length);

  /* ------------------------------ rotas ------------------------------ */
  const ROUTE_LIFT = 5;

    color: 0xd4ae62, transparent: true, opacity: 0.28, depthTest: false, depthWrite: false, side: THREE.DoubleSide,
  });

  const routeFx = {};
  routes.forEach((r) => {
    const pts = routePlans[r.id];

  const halo = new THREE.Mesh(

  let routeT = 0;           // < 0: espera a câmera chegar; 0..1: desenho da linha
  let routeShown = null;
  /** Recomeça a animação da rota selecionada. */

  /* -------------------------- seleção no terreno -------------------------- */
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const groundPlane = new THREE.Plane(UP, 0);

  /** Ponto do terreno sob o cursor, em coordenadas de plano (plano horizontal refinado pela altura). */
  function planAt(clientX, clientY) {

  /** Sol, céu, luz ambiente e névoa a partir da posição solar real (latitude, mês, hora). */
  function applySun(month, hour) {
    const { azimuth, altitude } = sunPosition(brand.site.latitude, month, hour);
    const planBearing = ((azimuth - brand.site.northOffsetDeg) * Math.PI) / 180;
    const altR = (Math.max(altitude, -6) * Math.PI) / 180;
    const dx = Math.sin(planBearing) * Math.cos(altR);

      head.visible = halo.visible = false;
    }


    composer.render(dt);
    placePins();
  }

  /* --------------------------- interação ------------------------- */
  const canvas = renderer.domElement;
  window.addEventListener("resize", () => {
    camera.aspect = host.clientWidth / host.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(host.clientWidth, host.clientHeight);
    composer.setSize(host.clientWidth, host.clientHeight);
  });
  canvas.tabIndex = 0;

  const pinchInfo = () => {
    const [a, b] = [...pointers.values()];
    return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  };
  const setGesture = (g) => {
    gesture = g;
    host.classList.toggle("is-dragging", g === "orbit");
    host.classList.toggle("is-panning", g === "pan" || g === "pinch");
  };

  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  canvas.addEventListener("pointerdown", (e) => {
    try { canvas.setPointerCapture(e.pointerId); } catch { /* ponteiro sintético ou já liberado */ }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    vel.yaw = vel.pitch = 0;
    hoverReq = null;
    if (state.playing) setState({ playing: false });
    if (state.hoverLot) setState({ hoverLot: null });
    if (pointers.size === 2) {
      const p = pinchInfo();
      pinchDist = p.d;
      pinchMid.x = p.x;
      pinchMid.y = p.y;
      moved = Infinity;
      setGesture("pinch");
    } else if (pointers.size === 1) {
      downX = e.clientX;
      downY = e.clientY;
      moved = 0;
      lastMoveT = performance.now();
      setGesture(e.button === 2 || e.shiftKey ? "pan" : "orbit");
    }
  });

  canvas.addEventListener("pointermove", (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) {
      if (e.pointerType === "mouse") hoverReq = { x: e.clientX, y: e.clientY };
      return;
    }
    const dx = e.clientX - p.x;
    const dy = e.clientY - p.y;
    p.x = e.clientX;
    p.y = e.clientY;
    moved = Math.max(moved, Math.hypot(e.clientX - downX, e.clientY - downY));

    if (gesture === "orbit") {
      const now = performance.now();
      const secs = Math.max(now - lastMoveT, 8) / 1000;
      lastMoveT = now;
      const dYaw = -dx * 0.0052;
      const dPitch = dy * 0.0042;
      user.yaw += dYaw;
      user.pitch += dPitch;
      // velocidade suavizada, usada como inércia ao soltar
      vel.yaw = clamp(mix(vel.yaw, dYaw / secs, 0.4), -4, 4);
      vel.pitch = clamp(mix(vel.pitch, dPitch / secs, 0.4), -3, 3);
    } else if (gesture === "pan") {
      panBy(dx, dy);
    } else if (gesture === "pinch") {
      const q = pinchInfo();
      user.zoom *= pinchDist / q.d;
      clampZoom();
      panBy(q.x - pinchMid.x, q.y - pinchMid.y);
      pinchDist = q.d;
      pinchMid.x = q.x;
      pinchMid.y = q.y;
    }
  });

  const endPointer = (e) => {
    if (!pointers.delete(e.pointerId)) return;
    if (pointers.size === 1) {
      // saiu um dedo da pinça: continua girando com o que ficou, sem salto
      const [p] = pointers.values();
      downX = p.x;
      downY = p.y;
      lastMoveT = performance.now();
      vel.yaw = vel.pitch = 0;
      setGesture("orbit");
      return;
    }
    if (pointers.size > 0) return;
    // clique sem arrastar, no capítulo Lotes, seleciona o lote
    if (e.type === "pointerup" && gesture === "orbit" && moved < 6 && state.chapter === "lotes") {
      const l = lotAtScreen(e.clientX, e.clientY);
      if (l) setState({ focusLot: state.focusLot === l.id ? null : l.id, drawer: true, sheetFull: true });
    }
    // soltou parado: sem inércia
    if (performance.now() - lastMoveT > 90) vel.yaw = vel.pitch = 0;
    setGesture(null);
  };
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("pointerleave", () => {
    hoverReq = null;
    if (state.hoverLot) setState({ hoverLot: null });
  });

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    if (state.playing) setState({ playing: false });
    // Chrome/Firefox: pinça do trackpad chega como wheel com ctrlKey e deltas pequenos
    user.zoom *= Math.exp(e.deltaY * (e.ctrlKey ? 0.01 : 0.0011));
    clampZoom();
  }, { passive: false });

  // Safari: pinça do trackpad chega como GestureEvent. Sem isso o Safari amplia a página inteira.
  // No iPhone/iPad a pinça já vem pelos pointer events; lá o gesto é só bloqueado.
  let gestureScale = 1;
  canvas.addEventListener("gesturestart", (e) => {
    e.preventDefault();
    gestureScale = e.scale;
  });
  canvas.addEventListener("gesturechange", (e) => {
    e.preventDefault();
    if (pointers.size < 2) {
      user.zoom *= gestureScale / e.scale;
      clampZoom();
    }
    gestureScale = e.scale;
  });
  canvas.addEventListener("gestureend", (e) => e.preventDefault());

  canvas.addEventListener("keydown", (e) => {
    const k = e.key;
    if (k === "ArrowLeft") user.yaw += 0.12;
    else if (k === "ArrowRight") user.yaw -= 0.12;
    else if (k === "ArrowUp") user.pitch += 0.08;
    else if (k === "ArrowDown") user.pitch -= 0.08;
    else if (k === "+" || k === "=") user.zoom *= 0.85;
    else if (k === "-" || k === "_") user.zoom /= 0.85;
    else if (k === "0" || k === "Home") resetView();
    else return;
    e.preventDefault();
    clampZoom();
  });

  // cada troca de capítulo ou de foco recomeça do enquadramento daquele contexto
  subscribe((c) => {
    if (c.has("chapter") || c.has("focusLot") || c.has("focusAmen")) resetView();
    if (c.has("route") || (c.has("chapter") && state.chapter === "rotas")) playRoute();
    if (c.has("chapter")) applyFilter();
  });

  // camadas de interface (lotes, rotas, realces): cor exata, sem névoa e fora do cálculo de AO
  sky.userData.noAO = true;
  scene.traverse((o) => {
    const m = o.material;
    if (m && (m.isMeshBasicMaterial || m.isLineBasicMaterial)) {
      m.toneMapped = false;
      m.fog = false;
      o.userData.noAO = true;
    }
  });
  if (gtao) {
    const hideForAO = gtao.overrideVisibility.bind(gtao);
    gtao.overrideVisibility = () => {
      hideForAO();   // guarda a visibilidade original antes de esconder
      scene.traverse((o) => { if (o.userData.noAO) o.visible = false; });
    };
  }

  applySun(state.month, state.hour);
  applyFilter();
  playRoute();
  frame();
  return { applyFilter, resetView, playRoute };
}

/* A construção da cena é pesada; adiamos alguns quadros para a UI e o indicador
   de carregamento pintarem antes do trabalho síncrono começar. */
setTimeout(() => {
  sceneApi = buildScene($("scene"));
  setState({ ready: true });
}, 120);
</script>
</body>
